plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.arcade'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.arcade.games'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // sideload-friendly; swap for your own key to publish
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
