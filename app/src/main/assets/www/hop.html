<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Hop</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';
/* ---------- TV: input, loop, audio, helpers ---------- */
var TV = (function () {
  var T = {}, cv = document.getElementById('c'), handlers = [], held = {}, actx = null, muted = false;
  T.cv = cv; T.ctx = cv.getContext('2d'); T.W = cv.width; T.H = cv.height; T.held = held; T.hint = "Press OK (or Up) to flap. Back returns to the menu.";

    if (k === 'ArrowRight' || c === 39 || c === 22 || k === 'd' || k === 'D') return 'right';
    if (k === 'ArrowUp' || c === 38 || c === 19 || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';

  }

    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('down', k, e.repeat);

    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('up', k, false);

  window.addEventListener('touchstart', function () { document.documentElement.className = 'touch'; T.fit(); }, false);
  var btns = document.querySelectorAll('.pb');
  for (var i = 0; i < btns.length; i++) (function (b) {
    var k = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); b.className = 'pb on'; fire('down', k, false); }
    function off(e) { e.preventDefault(); b.className = 'pb'; fire('up', k, false); }
    b.addEventListener('touchstart', on, false); b.addEventListener('touchend', off, false); b.addEventListener('touchcancel', off, false);
    b.addEventListener('mousedown', on, false); b.addEventListener('mouseup', off, false); b.addEventListener('mouseleave', off, false);
  })(btns[i]);

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);
    if (m) return m[1];
    return T.store.get('view', '3d') === '2d' ? '2d' : '3d';
  };
  T.dual = false;
  T.pick = function (d2, d3) {
    T.dual = true; var vw = document.getElementById('vw'); if (vw) vw.style.display = '';
    return function () { if (T.view() === '2d') d2(); else d3(); };
  };

    if (type !== 'down' || key !== 'view' || !T.dual) return;
    var n = T.view() === '2d' ? '3d' : '2d'; T.store.set('view', n);
    if (window.history && history.replaceState) { try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ } }

  });

  T.loop = function (update, draw) {
    var last = 0;
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      update(dt); draw();

  T.toast = function (msg, ms) {

    clearTimeout(T._tt); T._tt = setTimeout(function () { el.style.opacity = 0; }, ms || 4000);
  };

  T.store = {
    get: function (k, d) { try { var v = window.localStorage.getItem('tvarcade_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem('tvarcade_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };
  T.setMuted = function (m) { muted = !!m; };
  T.isMuted = function () { return muted; };

    if (muted) return;

      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.1, t); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* no audio */ }
  };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);
    T.text(title, T.W / 2, T.H * 0.30, 64, accent || '#ffd21f');
    for (var i = 0; i < lines.length; i++) T.text(lines[i], T.W / 2, T.H * 0.46 + i * 38, 26, '#dfe5ff');
  };
  T.rnd = function (a, b) { return a + Math.random() * (b - a); };
  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>
<script>
var TV3D = (function () {
  var T = {}, ctx = TV.ctx, W = TV.W, H = TV.H, faces = [], cam = null, light = [-0.35, 0.8, 0.45], amb = 0.5, fogCol = [150, 180, 220], fogS = 80, fogE = 400;

      var cx = 0, cy = 0, cz = 0, k;
      for (k = 0; k < f.length; k++) { cx += f[k][0]; cy += f[k][1]; cz += f[k][2]; }

    [[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]], [[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]],

    [[-h, -h, -h], [h, -h, -h], [0, h, 0]], [[h, -h, -h], [h, -h, h], [0, h, 0]], [[h, -h, h], [-h, -h, h], [0, h, 0]], [[-h, -h, h], [-h, -h, -h], [0, h, 0]],
    [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]]]);

<script>
(function () {
  var c = TV.ctx, W = TV.W, H = TV.H, GAP = 170;
  var state = 'title', bird, pipes, score, best = TV.store.get('hop_best', 0), spawnX, clouds = [], gx = 0, t = 0, shake = 0;
  for (var i = 0; i < 6; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 180, s: 0.7 + Math.random() * 0.8 });

  function newGame() { bird = { x: 250, y: H / 2, vy: 0, rot: 0 }; pipes = []; score = 0; spawnX = 700; state = 'play'; flap(); }
  function flap() { bird.vy = -420; TV.beep(560, 0.08, 'square', 0.08, 820); }
  function die() { state = 'over'; shake = 0.3; TV.beep(150, 0.35, 'sawtooth', 0.15, 50); if (score > best) { best = score; TV.store.set('hop_best', best); } }

  TV.on(function (type, key, rep) {
    if (type !== 'down' || rep) return;
    if (key === 'back') { if (state === 'play') state = 'pause'; else TV.exit(); return; }
    if (state === 'title' || state === 'over') { if (key === 'ok' || key === 'up') newGame(); return; }
    if (state === 'pause') { if (key === 'ok' || key === 'start') state = 'play'; return; }
    if (key === 'ok' || key === 'up') flap(); else if (key === 'start') state = 'pause';
  });

  function update(dt) {
    t += dt; if (shake > 0) shake -= dt;
    for (var i = 0; i < clouds.length; i++) { clouds[i].x -= 14 * clouds[i].s * dt; if (clouds[i].x < -100) clouds[i].x = W + 60; }
    if (state === 'title') { gx = (gx + 120 * dt) % 40; return; }
    if (state !== 'play') return;
    var speed = 170 + Math.min(110, score * 5);
    gx = (gx + speed * dt) % 40;
    bird.vy = Math.min(560, bird.vy + 1250 * dt); bird.y += bird.vy * dt; bird.rot = TV.clamp(bird.vy / 500, -0.5, 1.1);
    spawnX -= speed * dt;
    if (spawnX <= 0 || !pipes.length) { pipes.push({ x: W + 40, gy: TV.rnd(130, H - 130 - GAP + 40), scored: false }); spawnX = 280; }
    for (i = pipes.length - 1; i >= 0; i--) {
      var p = pipes[i]; p.x -= speed * dt;
      if (!p.scored && p.x + 30 < bird.x) { p.scored = true; score++; TV.beep(900, 0.07, 'square', 0.08, 1200); }
      if (bird.x + 16 > p.x - 30 && bird.x - 16 < p.x + 30 && (bird.y - 14 < p.gy || bird.y + 14 > p.gy + GAP)) { die(); }
      if (p.x < -60) pipes.splice(i, 1);
    }
    if (bird.y > H - 60 || bird.y < -20) die();
  }
  var K = 0.05, BX = 250;
  function X(x) { return (x - BX) * K; }
  function Y(y) { return (H - 50 - y) * K; }
  function draw2() {
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#4fb8ff'); g.addColorStop(1, '#bfe9ff');
    c.save(); if (shake > 0) c.translate(Math.random() * 8 - 4, Math.random() * 8 - 4);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (var i = 0; i < clouds.length; i++) { var k = clouds[i]; c.beginPath(); c.arc(k.x, k.y, 24 * k.s, 0, 6.3); c.arc(k.x + 26 * k.s, k.y + 6, 19 * k.s, 0, 6.3); c.arc(k.x - 24 * k.s, k.y + 8, 17 * k.s, 0, 6.3); c.fill(); }
    if (pipes) for (i = 0; i < pipes.length; i++) {
      var p = pipes[i];
      c.fillStyle = '#4caf50'; c.fillRect(p.x - 30, 0, 60, p.gy); c.fillRect(p.x - 30, p.gy + GAP, 60, H);
      c.fillStyle = '#2e7d32'; c.fillRect(p.x - 36, p.gy - 22, 72, 22); c.fillRect(p.x - 36, p.gy + GAP, 72, 22);
      c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(p.x - 24, 0, 8, p.gy - 22); c.fillRect(p.x - 24, p.gy + GAP + 22, 8, H);
    }
    c.fillStyle = '#8b5a2b'; c.fillRect(0, H - 50, W, 50); c.fillStyle = '#5CC94A'; c.fillRect(0, H - 50, W, 12);
    c.fillStyle = '#4aa83a'; for (i = -1; i < W / 40 + 1; i++) c.fillRect(i * 40 - gx, H - 50, 20, 12);
    if (bird) {
      c.save(); c.translate(bird.x, bird.y + (state === 'title' ? Math.sin(t * 5) * 8 : 0)); c.rotate(bird.rot);
      c.fillStyle = '#ffd21f'; c.beginPath(); c.arc(0, 0, 18, 0, 6.3); c.fill();
      c.fillStyle = '#ffb02e'; c.beginPath(); c.arc(-6, 6 + Math.sin(t * 20) * 3, 9, 0, 6.3); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(8, -6, 6, 0, 6.3); c.fill(); c.fillStyle = '#111'; c.fillRect(9, -8, 4, 4);
      c.fillStyle = '#ff7a45'; c.beginPath(); c.moveTo(16, 0); c.lineTo(30, 4); c.lineTo(16, 9); c.fill();
      c.restore();
    }
    c.restore();
    if (state === 'play' || state === 'pause') TV.text(String(score), W / 2, 60, 64, '#fff');
    if (state === 'title') { c.fillStyle = 'rgba(8,12,40,.55)'; c.fillRect(0, 0, W, H); TV.text('SKY HOP', W / 2, H * 0.30, 72, '#ffd21f'); TV.text('Press OK to flap and start', W / 2, H * 0.48, 28, '#fff'); TV.text('Best ' + best, W / 2, H * 0.58, 24, '#cfd6ff'); }
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to try again', 'Back: menu'], '#ff5a4e');
  }
  var draw = TV.pick(draw2, draw3);
  function draw3() {
    var G = TV3D, i, p;
    c.save(); if (shake > 0) c.translate(Math.random() * 8 - 4, Math.random() * 8 - 4);
    G.sky('#4fb8ff', '#cdeeff', H * 0.9);
    G.camera([11.5, 11.5, 26], [11.5, 11, 0], 50); G.fog('#cdeeff', 40, 120); G.light(0.62);
    for (i = 0; i < clouds.length; i++) { var k = clouds[i], cx = X(k.x), cy = Y(k.y) + 6; G.box(cx, cy, -14, 7 * k.s, 2.2 * k.s, 3, '#ffffff', 0.6); G.box(cx + 2 * k.s, cy + 1.2 * k.s, -14, 4.5 * k.s, 2 * k.s, 3, '#ffffff', 0.6); }
    G.box(11.5, -1, 0, 90, 2, 16, '#8b5a2b'); G.box(11.5, 0.05, 0, 90, 0.2, 16, '#5CC94A');
    for (i = -2; i < 30; i++) { var sx = ((i * 40) - gx) * K + BX * 0; G.box(sx - 1, 0.2, 7.6, 1, 0.1, 0.7, '#4aa83a'); }
    if (pipes) for (i = 0; i < pipes.length; i++) {
      p = pipes[i]; var px = X(p.x), topH = (p.gy) * K, botTop = Y(p.gy + GAP), botH = botTop;
      G.box(px, Y(p.gy) + topH / 2, 0, 3, topH, 3, '#4caf50'); G.box(px, Y(p.gy) + 0.5, 0, 3.8, 1.0, 3.8, '#2e7d32');
      G.box(px, botH / 2, 0, 3, botH, 3, '#4caf50'); G.box(px, botH - 0.5, 0, 3.8, 1.0, 3.8, '#2e7d32');
    }
    if (bird) {
      var by = Y(bird.y + (state === 'title' ? Math.sin(t * 5) * 8 : 0)), r = bird.rot * 0.5;
      G.shadow(0, 0, 1.6, 1.6, 0.05);
      G.prismZ(0, by, 0, 2.3, 2.3, 1.8, '#ffd21f');
      G.box(-0.5, by - 0.2 + Math.sin(t * 20) * 0.25, 0.9, 1.0, 0.5, 0.2, '#ffb02e');
      G.box(0.5, by + 0.35, 0.85, 0.5, 0.5, 0.2, '#ffffff', 0.5); G.box(0.6, by + 0.35, 0.95, 0.25, 0.25, 0.2, '#111');
      G.box(1.35, by - r, 0, 0.9, 0.5, 0.7, '#ff7a45');
    }
    G.flush(); c.restore();
    if (state === 'play' || state === 'pause') TV.text(String(score), W / 2, 60, 64, '#fff');
    if (state === 'title') { c.fillStyle = 'rgba(8,12,40,.55)'; c.fillRect(0, 0, W, H); TV.text('SKY HOP 3D', W / 2, H * 0.30, 72, '#ffd21f'); TV.text('Press OK to flap and start', W / 2, H * 0.48, 28, '#fff'); TV.text('Best ' + best, W / 2, H * 0.58, 24, '#cfd6ff'); }
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to try again', 'Back: menu'], '#ff5a4e');
  }
  TV.loop(update, draw);
})();
</script>
