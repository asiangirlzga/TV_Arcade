<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>2048</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';
/* ---------- TV: input, loop, audio, helpers ---------- */

  var T = {}, cv = document.getElementById('c'), handlers = [], held = {}, actx = null, muted = false;
  T.cv = cv; T.ctx = cv.getContext('2d'); T.W = cv.width; T.H = cv.height; T.held = held; T.hint = "Arrow keys slide the tiles. P starts a new game. Back returns to the menu.";

    if (k === 'ArrowUp' || c === 38 || c === 19 || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);
    if (m) return m[1];
    return T.store.get('view', '3d') === '2d' ? '2d' : '3d';
  };
  T.dual = false;
  T.pick = function (d2, d3) {
    T.dual = true; var vw = document.getElementById('vw'); if (vw) vw.style.display = '';
    return function () { if (T.view() === '2d') d2(); else d3(); };

  T.loop = function (update, draw) {
    var last = 0;

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);

  };

  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>

(function () {
  var c = TV.ctx, W = TV.W, H = TV.H, N = 4, SZ = 100, GAPX = 10, OX = (W - (N * SZ + (N + 1) * GAPX)) / 2, OY = 62;
  var grid, score, best = TV.store.get('g2048_best', 0), state = 'play', won = false, keepGoing = false, pop = {}, spawnKey = '';
  var COL = { 0: '#26346a', 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };

  function empty() { var g = []; for (var y = 0; y < N; y++) { g.push([]); for (var x = 0; x < N; x++) g[y].push(0); } return g; }
  function addTile() {
    var free = []; for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) if (!grid[y][x]) free.push([x, y]);
    if (!free.length) return; var f = free[Math.floor(Math.random() * free.length)];
    grid[f[1]][f[0]] = Math.random() < 0.9 ? 2 : 4; pop[f[0] + ',' + f[1]] = 1;
  }
  function newGame() { grid = empty(); score = 0; won = false; keepGoing = false; state = 'play'; pop = {}; addTile(); addTile(); }
  /* slide one line toward index 0, returns {line, gained} */
  function slide(line) {
    var a = [], i, gained = 0; for (i = 0; i < N; i++) if (line[i]) a.push(line[i]);
    for (i = 0; i < a.length - 1; i++) if (a[i] === a[i + 1]) { a[i] *= 2; gained += a[i]; a.splice(i + 1, 1); }
    while (a.length < N) a.push(0); return { line: a, gained: gained };
  }
  function move(dir) {
    var moved = false, gain = 0, y, x, i, line, r;
    for (var k = 0; k < N; k++) {
      line = [];
      for (i = 0; i < N; i++) {
        if (dir === 'left') line.push(grid[k][i]); else if (dir === 'right') line.push(grid[k][N - 1 - i]);
        else if (dir === 'up') line.push(grid[i][k]); else line.push(grid[N - 1 - i][k]);
      }
      r = slide(line); gain += r.gained;
      for (i = 0; i < N; i++) {
        var v = r.line[i], px, py;
        if (dir === 'left') { px = i; py = k; } else if (dir === 'right') { px = N - 1 - i; py = k; } else if (dir === 'up') { px = k; py = i; } else { px = k; py = N - 1 - i; }
        if (grid[py][px] !== v) { moved = true; grid[py][px] = v; }
      }
    }
    if (!moved) return;
    pop = {}; score += gain; if (gain) TV.beep(500 + Math.min(600, gain * 4), 0.06, 'square', 0.07); else TV.beep(300, 0.03, 'square', 0.04);
    addTile();
    if (score > best) { best = score; TV.store.set('g2048_best', best); }
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) if (grid[y][x] >= 2048 && !keepGoing) { won = true; state = 'won'; }
    if (state === 'play' && !canMove()) state = 'over';
  }
  function canMove() {
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      if (!grid[y][x]) return true;
      if (x < N - 1 && grid[y][x] === grid[y][x + 1]) return true;
      if (y < N - 1 && grid[y][x] === grid[y + 1][x]) return true;
    }
    return false;
  }

  TV.on(function (type, key, rep) {
    if (type !== 'down') return;
    if (key === 'back') { TV.exit(); return; }
    if (state === 'over') { if (key === 'ok' || key === 'start') newGame(); return; }
    if (state === 'won') { if (key === 'ok') { keepGoing = true; state = 'play'; } else if (key === 'start') newGame(); return; }
    if (key === 'left' || key === 'right' || key === 'up' || key === 'down') move(key);
    else if (key === 'start') newGame();
  });
  newGame();

  var t = 0;
  var PITCH = 1.15;
  function draw2() {
    c.fillStyle = '#0f1a3d'; c.fillRect(0, 0, W, H);
    TV.text('2048', 30, 32, 40, '#ffd21f', 'left');
    TV.text('SCORE ' + score, W - 230, 32, 22, '#fff', 'right'); TV.text('BEST ' + best, W - 30, 32, 22, '#ffd21f', 'right');
    var bw = N * SZ + (N + 1) * GAPX; c.fillStyle = '#18224a'; c.fillRect(OX, OY, bw, bw);
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var v = grid[y][x], px = OX + GAPX + x * (SZ + GAPX), py = OY + GAPX + y * (SZ + GAPX);
      c.fillStyle = COL[v] || '#3c3a32'; c.fillRect(px, py, SZ, SZ);
      if (v) { c.font = 'bold ' + (v < 100 ? 48 : v < 1000 ? 40 : 32) + 'px Arial, Helvetica, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = v <= 4 ? '#6b5d4f' : '#fff'; c.fillText(String(v), px + SZ / 2, py + SZ / 2 + 2); }
    }
    if (state === 'over') TV.panel('NO MOVES LEFT', ['Score ' + score + '   Best ' + best, 'Press OK for a new game', 'Back: menu'], '#ff5a4e');
    else if (state === 'won') TV.panel('YOU REACHED 2048!', ['OK: keep going', 'P: new game'], '#ffd21f');
  }
  var draw = TV.pick(draw2, draw3);
  function draw3() {
    var G = TV3D, x, y;
    c.fillStyle = '#0b1030'; c.fillRect(0, 0, W, H);
    G.camera([0, 7.4, 5.6], [0, 0, 0.35], 46); G.fog('#0b1030', 30, 70); G.light(0.58);
    var hb = 2 * PITCH + 0.35;
    G.quad([-hb, 0, hb], [hb, 0, hb], [hb, 0, -hb], [-hb, 0, -hb], '#1d2a63');
    G.box(0, 0.12, -hb - 0.12, hb * 2 + 0.5, 0.3, 0.25, '#2c3b78'); G.box(0, 0.12, hb + 0.12, hb * 2 + 0.5, 0.3, 0.25, '#2c3b78');
    G.box(-hb - 0.12, 0.12, 0, 0.25, 0.3, hb * 2, '#2c3b78'); G.box(hb + 0.12, 0.12, 0, 0.25, 0.3, hb * 2, '#2c3b78');
    var labels = [];
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
      var v = grid[y][x], wx = (x - 1.5) * PITCH, wz = (y - 1.5) * PITCH;
      G.quad([wx - 0.5, 0.01, wz + 0.5], [wx + 0.5, 0.01, wz + 0.5], [wx + 0.5, 0.01, wz - 0.5], [wx - 0.5, 0.01, wz - 0.5], '#26346a');
      if (v) {
        var lg = Math.log(v) / Math.LN2, hh = 0.35 + lg * 0.13;
        G.box(wx, hh / 2, wz, 1.0, hh, 1.0, COL[v] || '#3c3a32', v >= 128 ? 0.15 : 0);
        labels.push([wx, hh + 0.01, wz, v]);
      }
    }
    G.flush();
    for (var i = 0; i < labels.length; i++) {
      var p = G.project([labels[i][0], labels[i][1], labels[i][2] + 0.05]); if (!p) continue;
      var v2 = labels[i][3], size = G.scale(p[2]) * (v2 < 100 ? 0.5 : v2 < 1000 ? 0.42 : 0.34);
      c.font = 'bold ' + Math.round(size) + 'px Arial, Helvetica, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = v2 <= 4 ? '#6b5d4f' : '#fff'; c.fillText(String(v2), p[0], p[1]);
    }
    TV.text('2048 3D', 30, 32, 36, '#ffd21f', 'left');
    TV.text('SCORE ' + score, W - 230, 32, 22, '#fff', 'right'); TV.text('BEST ' + best, W - 30, 32, 22, '#ffd21f', 'right');
    if (state === 'over') TV.panel('NO MOVES LEFT', ['Score ' + score + '   Best ' + best, 'Press OK for a new game', 'Back: menu'], '#ff5a4e');
    else if (state === 'won') TV.panel('YOU REACHED 2048!', ['OK: keep going', 'P: new game'], '#ffd21f');
  }
  TV.loop(function (dt) { t += dt; }, draw);
})();
