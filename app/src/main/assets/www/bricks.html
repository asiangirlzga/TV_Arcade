<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Builder</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>

})();
</script>

  var bricks = [], hm = [], top = [], i, j;
  var cx = 7, cz = 7, shape = 2, rot = 0, col = 4, view = 0, state = 0, dirty = true, t = 0, msg = '', msgT = 0;
  var off = document.createElement('canvas'); off.width = W; off.height = H; var offc = off.getContext('2d');

  function reset2d() { hm = []; top = []; for (i = 0; i < N; i++) { hm.push([]); top.push([]); for (j = 0; j < N; j++) { hm[i].push(0); top[i].push(-1); } } }
  function dims(s, r) { var sh = SHAPES[s]; return r ? [sh[1], sh[0]] : [sh[0], sh[1]]; }
  function rebuildGrid() {
    reset2d();
    for (var b = 0; b < bricks.length; b++) {
      var k = bricks[b], d = dims(k[0], k[3]), x, z;
      for (x = k[1]; x < k[1] + d[0]; x++) for (z = k[2]; z < k[2] + d[1]; z++) { if (k[5] + 1 > hm[x][z]) hm[x][z] = k[5] + 1; top[x][z] = b; }
    }
  }
  function layerAt(x, z, d) {
    var m = 0, a, b;
    for (a = x; a < x + d[0]; a++) for (b = z; b < z + d[1]; b++) if (hm[a][b] > m) m = hm[a][b];
    return m;
  }
  function canPlace(x, z, d) {
    if (bricks.length >= MAXB) return false;
    var a, b, tb;
    for (a = x; a < x + d[0]; a++) for (b = z; b < z + d[1]; b++) { tb = top[a][b]; if (tb >= 0 && SHAPES[bricks[tb][0]][3]) return false; }   // nothing sits on a roof
    return true;
  }
  function save() { TV.store.set('bb_save', bricks); }
  function load() {
    var s = TV.store.get('bb_save', []);
    bricks = [];
    if (s instanceof Array) for (var k = 0; k < s.length && k < MAXB; k++) {
      var b = s[k]; if (b instanceof Array && b.length === 6 && b[0] >= 0 && b[0] < SHAPES.length && b[1] >= 0 && b[2] >= 0 && b[1] < N && b[2] < N) bricks.push([b[0] | 0, b[1] | 0, b[2] | 0, b[3] ? 1 : 0, b[4] | 0, b[5] | 0]);
    }
    rebuildGrid(); dirty = true;
  }
  function add(s, x, z, r, cl, layer) { if (bricks.length >= MAXB) return; bricks.push([s, x, z, r ? 1 : 0, cl, layer]); }
  function say(m) { msg = m; msgT = 1.6; }

  /* a ready-made castle to look at, change or tear down */
  function castle() {
    bricks = []; var k, L, cl;
    var corners = [[2, 2], [12, 2], [2, 12], [12, 12]], roofs = [4, 3, 0, 1];
    for (k = 0; k < 4; k++) { for (L = 0; L < 7; L++) add(2, corners[k][0], corners[k][1], 0, [0, 2, 1, 4][(L + k) % 4], L); add(5, corners[k][0], corners[k][1], 0, roofs[k], 7); }
    for (L = 0; L < 4; L++) {
      cl = L % 2 ? 2 : 4;
      add(3, 4, 2, 1, cl, L); add(3, 8, 2, 1, cl, L);                 // back wall (runs along x)
      add(3, 2, 4, 0, cl, L); add(3, 2, 8, 0, cl, L);                 // left wall (runs along z)
      add(3, 13, 4, 0, cl, L); add(3, 13, 8, 0, cl, L);               // right wall
      if (L < 3) { add(1, 4, 13, 1, cl, L); add(1, 10, 13, 1, cl, L); }   // front wall with a gate in the middle
      else { add(3, 4, 13, 1, cl, L); add(3, 8, 13, 1, cl, L); }
    }
    for (L = 0; L < 5; L++) { cl = [1, 2, 0, 4, 2][L]; add(4, 6, 5, 0, cl, L); add(4, 8, 5, 0, cl, L); }
    for (L = 5; L < 8; L++) add(2, 7, 6, 0, L % 2 ? 2 : 0, L);
    add(5, 7, 6, 0, 0, 8);
    rebuildGrid(); dirty = true; save();
  }

  /* ---------------------------------------------------------------- input */
  function move(dx, dz) {
    var ang = view * Math.PI / 2, fx = Math.round(-Math.sin(ang)), fz = Math.round(-Math.cos(ang)), rx = Math.round(Math.cos(ang)), rz = Math.round(-Math.sin(ang));
    cx += dx * rx + dz * fx; cz += dx * rz + dz * fz; clampCursor();
  }
  function clampCursor() { var d = dims(shape, rot); cx = TV.clamp(cx, 0, N - d[0]); cz = TV.clamp(cz, 0, N - d[1]); }
  function place() {
    var d = dims(shape, rot);
    if (!canPlace(cx, cz, d)) { TV.beep(120, 0.12, 'square', 0.08); say(bricks.length >= MAXB ? 'The baseplate is full' : 'Nothing can sit on a roof'); return; }
    bricks.push([shape, cx, cz, rot, col, layerAt(cx, cz, d)]); rebuildGrid(); dirty = true; save(); TV.beep(420, 0.06, 'square', 0.09, 120);
  }
  function undo() { if (!bricks.length) return; bricks.pop(); rebuildGrid(); dirty = true; save(); TV.beep(240, 0.07, 'triangle', 0.08); }
  TV.on(function (type, key, rep) {
    if (type !== 'down') return;
    if (key === 'back') { TV.exit(); return; }
    if (state === 0) { if (key === 'ok' || key === 'start') state = 1; else if (key === 'k1') { castle(); state = 1; } return; }
    if (key === 'left') move(-1, 0); else if (key === 'right') move(1, 0); else if (key === 'up') move(0, 1); else if (key === 'down') move(0, -1);
    else if (rep) return;
    else if (key === 'ok') place();
    else if (key === 'k1') { if (!SHAPES[shape][3]) { rot = rot ? 0 : 1; clampCursor(); } }
    else if (key === 'k2') { col = (col + 1) % COLORS.length; say(CNAME[col]); }
    else if (key === 'k3') { shape = (shape + 1) % SHAPES.length; rot = 0; clampCursor(); say(SHAPES[shape][2]); }
    else if (key === 'k4') { view = (view + 1) % 4; dirty = true; }
    else if (key === 'start') undo();
  });
  (function () {     /* on-screen buttons for touch screens */
    var pad = document.getElementById('pad'); if (!pad) return;
    var row = document.createElement('div'), defs = [['k1', 'Turn'], ['k2', 'Colour'], ['k3', 'Shape'], ['k4', 'View'], ['start', 'Undo']];
    function wire(b, k) {
      function dn(e) { e.preventDefault(); TV.fire('down', k, false); }
      function up(e) { e.preventDefault(); TV.fire('up', k, false); }
      b.addEventListener('touchstart', dn, false); b.addEventListener('touchend', up, false); b.addEventListener('mousedown', dn, false); b.addEventListener('mouseup', up, false);
    }
    for (var d = 0; d < defs.length; d++) { var b = document.createElement('span'); b.className = 'pb'; b.style.fontSize = '12px'; b.appendChild(document.createTextNode(defs[d][1])); wire(b, defs[d][0]); row.appendChild(b); }
    pad.appendChild(row);
  })();

  /* ---------------------------------------------------------------- drawing */
  function setCam() {
    var a = view * Math.PI / 2 + 0.42;
    G.camera([Math.sin(a) * 22, 18.5, Math.cos(a) * 22], [0, 3.4, 0], 46); G.fog('#ffffff', 120, 300); G.light(0.5);
  }
  function wx(i) { return i - N / 2; }
  function renderBricks() {
    offc.clearRect(0, 0, W, H);
    G.target(offc); setCam();
    var h = N / 2, g = offc, x, z, b, k;
    G.quad([-h, 0, h], [h, 0, h], [h, 0, -h], [-h, 0, -h], '#3f9e46', g);
    G.quad([-h, -0.5, h], [h, -0.5, h], [h, 0, h], [-h, 0, h], '#2c7a33', g); G.quad([h, -0.5, h], [h, -0.5, -h], [h, 0, -h], [h, 0, h], '#276f2e', g);
    G.quad([-h, -0.5, -h], [-h, -0.5, h], [-h, 0, h], [-h, 0, -h], '#276f2e', g); G.quad([h, -0.5, -h], [-h, -0.5, -h], [-h, 0, -h], [h, 0, -h], '#2c7a33', g);
    for (b = 0; b < bricks.length; b++) {
      k = bricks[b]; var d = dims(k[0], k[3]), y0 = k[5] * BH, cl = COLORS[k[4]];
      if (SHAPES[k[0]][3]) {
        G.box(wx(k[1]) + 1, y0 + 0.25, wx(k[2]) + 1, 2 - GAP * 2, 0.5, 2 - GAP * 2, cl);
        G.pyramid(wx(k[1]) + 1, y0 + 0.5 + 1.05, wx(k[2]) + 1, 1.9, 2.1, 1.9, cl);
        continue;
      }
      for (x = k[1]; x < k[1] + d[0]; x++) for (z = k[2]; z < k[2] + d[1]; z++) {
        G.box(wx(x) + 0.5, y0 + (BH - 0.03) / 2, wx(z) + 0.5, 1 - GAP * 2, BH - 0.03, 1 - GAP * 2, cl);
        if (top[x][z] === b) G.prismY(wx(x) + 0.5, y0 + BH - 0.03 + 0.11, wx(z) + 0.5, 0.56, 0.22, 0.56, cl);
      }
    }
    for (x = 0; x < N; x++) for (z = 0; z < N; z++) if (hm[x][z] === 0) G.prismY(wx(x) + 0.5, 0.11, wx(z) + 0.5, 0.56, 0.22, 0.56, '#4cae54');
    G.flush(); G.target(null); dirty = false;
  }
  function drawGhost() {
    var d = dims(shape, rot), ok = canPlace(cx, cz, d), L = layerAt(cx, cz, d), roof = SHAPES[shape][3], bob = Math.sin(t * 5) * 0.06;
    var px = wx(cx) + d[0] / 2, pz = wx(cz) + d[1] / 2, py = L * BH + bob, color = ok ? COLORS[col] : '#ff3b30';
    c.globalAlpha = 0.78;
    if (roof) { G.box(px, py + 0.25, pz, 1.94, 0.5, 1.94, color, 0.3); G.pyramid(px, py + 1.55, pz, 1.9, 2.1, 1.9, color, 0.3); }
    else G.box(px, py + BH / 2, pz, d[0] - 0.02, BH, d[1] - 0.02, color, 0.3);
    G.flush(); c.globalAlpha = 1;
    /* shadow-ish footprint on the surface */
    var y = L * BH + 0.02; c.globalAlpha = 0.5;
    G.quad([px - d[0] / 2, y, pz + d[1] / 2], [px + d[0] / 2, y, pz + d[1] / 2], [px + d[0] / 2, y, pz - d[1] / 2], [px - d[0] / 2, y, pz - d[1] / 2], ok ? '#ffffff' : '#ff3b30');
    c.globalAlpha = 1;
  }
  function tallest() { var m = 0, a, b; for (a = 0; a < N; a++) for (b = 0; b < N; b++) if (hm[a][b] > m) m = hm[a][b]; return m; }

  function update(dt) { t += dt; if (msgT > 0) msgT -= dt; }
  function draw() {
    if (dirty) renderBricks();
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#cfe0f4'); g.addColorStop(1, '#f7f9fc'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    setCam();
    c.drawImage(off, 0, 0);
    if (state === 1) drawGhost();
    if (state === 1) {
      TV.text('BRICKS ' + bricks.length + ' / ' + MAXB + '    HEIGHT ' + tallest(), 16, 24, 20, '#23304f', 'left');
      var sh = SHAPES[shape], bx = W / 2 - 110, by = H - 96;
      c.fillStyle = 'rgba(255,255,255,0.88)'; c.fillRect(bx, by, 220, 40);
      c.fillStyle = COLORS[col]; c.fillRect(bx + 8, by + 8, 24, 24); c.strokeStyle = '#23304f'; c.lineWidth = 2; c.strokeRect(bx + 8, by + 8, 24, 24);
      TV.text(sh[2] + '   ' + CNAME[col], bx + 44, by + 26, 20, '#23304f', 'left');
      if (msgT > 0) TV.text(msg, W / 2, 70, 22, '#23304f', 'center');
    } else TV.panel('BRICK BUILDER', ['Press OK to build', 'Press 1 to start with a castle', 'Arrows move, OK places a brick', '1 turn, 2 colour, 3 shape, 4 view, P undo'], '#1e88e5');
  }

  reset2d(); load();
  TV.loop(update, draw);
})();
</script>

</body></html>
