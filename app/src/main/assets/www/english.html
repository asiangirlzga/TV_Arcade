  /* ------------------------------------------------------------ drawing */

  /* one simple picture; (cx, base) is bottom-centre, s is its size in pixels */
  function thing(k, cx, base, s) {

  function fs(w) { var L = w.length; return L <= 2 ? 84 : L <= 4 ? 70 : L <= 6 ? 54 : L <= 7 ? 44 : 38; }
  function glow(i) { return misses >= 3 && choices[i] === q.ans && Math.sin(t * 8) > 0; }

  function drawMenu() {
