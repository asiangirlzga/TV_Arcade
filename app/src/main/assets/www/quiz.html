<style>

  .touch #exit{display:block}

    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';

  return T;
})();

(function () {

    if (s > (best[pk.id] || 0)) best[pk.id] = s; stickers++;

  }

      goodIdx = i; celebT = 2.4; burst(style === 'balloon' ? bx : laneX(i, choices.length), style === 'balloon' ? by : 380);

      setTimeout(function () { say(q.full); }, 350);

  function balloonPos(i) { var n = choices.length; return [W / 2 + (i - (n - 1) / 2) * 220, 390 + (i % 2) * 50 + Math.sin(t * 1.6 + i * 1.7) * 12]; }
  function nearest() {

    for (i = 0; i < choices.length; i++) { if (gone[i]) continue; var p = balloonPos(i), dx = p[0] - bx, dy = p[1] - by, d = Math.sqrt(dx * dx + dy * dy); if (d < bd) { bd = d; bi = i; } }

  /* ------------------------------------------------------------ drawing */

  function star(x, y, r, col) {
    c.fillStyle = col; c.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
    c.closePath(); c.fill(); c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 2; c.stroke();
  }
  function pal(cx, cy, sc) {
    c.save(); c.translate(cx, cy); c.scale(sc, sc);
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.beginPath(); c.ellipse(0, 28, 24, 7, 0, 0, 6.283); c.fill();
    c.fillStyle = '#4aa3ff'; c.beginPath(); c.ellipse(0, 4, 26, 26, 0, 0, 6.283); c.fill();
    c.beginPath(); c.moveTo(-22, -12); c.lineTo(-16, -34); c.lineTo(-6, -20); c.closePath(); c.fill(); c.beginPath(); c.moveTo(22, -12); c.lineTo(16, -34); c.lineTo(6, -20); c.closePath(); c.fill();
    c.fillStyle = '#d7ecff'; c.beginPath(); c.ellipse(0, 12, 16, 12, 0, 0, 6.283); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-9, -3, 7, 0, 6.283); c.arc(9, -3, 7, 0, 6.283); c.fill();
    c.fillStyle = '#16214d'; c.beginPath(); c.arc(-6, -3, 3.5, 0, 6.283); c.arc(12, -3, 3.5, 0, 6.283); c.fill();
    c.strokeStyle = '#16214d'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 9, 7, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    c.restore();
  }
  /* text that wraps and shrinks to fit a box */
  function wrap(str, size, maxW) {
    var words = String(str).split(' '), lines = [], cur = '', i, test;
    c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif';
    for (i = 0; i < words.length; i++) {
      test = cur ? cur + ' ' + words[i] : words[i];
      if (cur && c.measureText(test).width > maxW) { lines.push(cur); cur = words[i]; } else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function widest(lines) { var m = 0, i; for (i = 0; i < lines.length; i++) m = Math.max(m, c.measureText(lines[i]).width); return m; }
  function fitText(str, cx, cy, maxW, maxH, maxS, col) {
    var s, lines, i, y0;
    for (s = maxS; s >= 16; s -= 2) { lines = wrap(str, s, maxW); if (lines.length * s * 1.18 <= maxH && widest(lines) <= maxW) break; }
    if (s < 16) s = 16;
    c.font = 'bold ' + s + 'px Arial, Helvetica, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    y0 = cy - (lines.length - 1) * s * 0.59;
    for (i = 0; i < lines.length; i++) {
      c.lineWidth = Math.max(3, s / 6); c.strokeStyle = 'rgba(0,0,0,0.45)'; c.strokeText(lines[i], cx, y0 + i * s * 1.18);
      c.fillStyle = col || '#fff'; c.fillText(lines[i], cx, y0 + i * s * 1.18);
    }
  }
  function glow(i) { return misses >= 3 && choices[i] === q.ans && Math.sin(t * 8) > 0; }

  function drawTap() {
    var n = choices.length, w0 = n === 4 ? 200 : n === 3 ? 250 : 320;
    for (var i = 0; i < n; i++) {
      var x = laneX(i, n) - w0 / 2, y = 268, w = w0, h = 190, f = sel === i, off = gone[i];
      if (f) { x -= 8; y -= 8; w += 16; h += 16; }
      c.globalAlpha = off ? 0.25 : 1; rr(x, y, w, h, 24); c.fillStyle = pk.color; c.fill();
      c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 6, y + 6, w - 12, h * 0.4, 18); c.fill();
      if (f || glow(i)) { rr(x - 5, y - 5, w + 10, h + 10, 28); c.strokeStyle = glow(i) ? '#ffd21f' : '#fff'; c.lineWidth = 6; c.stroke(); }
      fitText(choices[i], x + w / 2, y + h / 2, w - 28, h - 28, 62); c.globalAlpha = 1;
    }
  }
  function drawDoor() {
    var n = choices.length, dw = n === 4 ? 160 : 190;
    c.fillStyle = '#6dbb5a'; c.fillRect(0, 484, W, 56);
    for (var i = 0; i < n; i++) {
      var x = laneX(i, n) - dw / 2, y = 262, w = dw, h = 225, f = sel === i, off = gone[i];
      c.globalAlpha = off ? 0.25 : 1;
      c.fillStyle = '#7b4a2b'; rr(x - 8, y - 8, w + 16, h + 8, 20); c.fill();
      var open = celebT > 0 && goodIdx === i;
      c.fillStyle = open ? '#fff3b0' : pk.color; rr(x, y, w, h, 16); c.fill();
      if (!open) { c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 8, y + 8, w - 16, 50, 12); c.fill(); c.fillStyle = '#ffd21f'; c.beginPath(); c.arc(x + w - 18, y + h * 0.6, 8, 0, 6.283); c.fill(); }
      if (f || glow(i)) { rr(x - 12, y - 12, w + 24, h + 16, 24); c.strokeStyle = glow(i) ? '#ffd21f' : '#fff'; c.lineWidth = 6; c.stroke(); }
      fitText(choices[i], x + w / 2 - 6, y + h / 2 - 4, w - 40, h - 70, 46); c.globalAlpha = 1;
    }
    pal(palX, 462, 0.9);
  }
  function drawCatch() {
    var n = choices.length, fr = fallT / 6.5, y = 290 + fr * 160, i;
    c.fillStyle = '#6dbb5a'; c.fillRect(0, 506, W, 34);
    for (i = 0; i < n; i++) {
      var x = laneX(i, n);
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(x - 100, 240, 200, 266);
      if (!gone[i] && !(celebT > 0 && goodIdx !== i)) {
        var yy = (celebT > 0 && goodIdx === i) ? 455 : y;
        c.fillStyle = FRUIT[i]; c.beginPath(); c.arc(x, yy, 52, 0, 6.283); c.fill();
        c.fillStyle = '#3a8a2b'; c.beginPath(); c.ellipse(x + 8, yy - 54, 14, 7, -0.5, 0, 6.283); c.fill();
        if (glow(i)) { c.strokeStyle = '#ffd21f'; c.lineWidth = 6; c.beginPath(); c.arc(x, yy, 60, 0, 6.283); c.stroke(); }
        fitText(choices[i], x, yy + 2, 88, 50, 34);
      }
    }
    var bxx = laneX(sel, n);
    c.fillStyle = '#b7793a'; c.beginPath(); c.moveTo(bxx - 70, 474); c.lineTo(bxx + 70, 474); c.lineTo(bxx + 52, 522); c.lineTo(bxx - 52, 522); c.closePath(); c.fill();
    c.fillStyle = '#d99a52'; c.fillRect(bxx - 74, 468, 148, 10);
  }
  function drawBalloons() {
    for (var i = 0; i < choices.length; i++) {
      if (gone[i] || (celebT > 0 && goodIdx === i)) continue;
      var p = balloonPos(i);
      c.strokeStyle = 'rgba(40,50,90,0.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(p[0], p[1] + 62); c.quadraticCurveTo(p[0] + 10 * Math.sin(t * 2 + i), p[1] + 100, p[0], p[1] + 125); c.stroke();
      c.fillStyle = BALLOON[i]; c.beginPath(); c.ellipse(p[0], p[1], 64, 68, 0, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.3)'; c.beginPath(); c.ellipse(p[0] - 22, p[1] - 28, 12, 20, -0.5, 0, 6.283); c.fill();
      c.fillStyle = BALLOON[i]; c.beginPath(); c.moveTo(p[0], p[1] + 66); c.lineTo(p[0] - 8, p[1] + 78); c.lineTo(p[0] + 8, p[1] + 78); c.closePath(); c.fill();
      if (glow(i)) { c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.ellipse(p[0], p[1], 72, 76, 0, 0, 6.283); c.stroke(); }
      fitText(choices[i], p[0], p[1] + 2, 100, 60, 40);
    }
    if (celebT <= 0) {
      var n = nearest(); c.strokeStyle = n >= 0 ? '#ffd21f' : '#ffffff'; c.lineWidth = 5; c.beginPath(); c.arc(bx, by, 26 + (n >= 0 ? 4 : 0), 0, 6.283); c.stroke();
      c.beginPath(); c.moveTo(bx - 38, by); c.lineTo(bx - 14, by); c.moveTo(bx + 14, by); c.lineTo(bx + 38, by); c.moveTo(bx, by - 38); c.lineTo(bx, by - 14); c.moveTo(bx, by + 14); c.lineTo(bx, by + 38); c.stroke();
    }
  }

  function drawMenu() {
    var N = PACKS.length, i, k, vis = Math.min(5, N), start = TV.clamp(opI - 2, 0, Math.max(0, N - vis));
    fitText('PICK A LESSON', W / 2, 54, 700, 60, 46);
    for (i = 0; i < vis; i++) {
      var idx = start + i, p = PACKS[idx], x = 40 + i * 182, y = 110, w = 170, h = 300, f = opI === idx;
      if (f) { x -= 8; y -= 10; w += 16; h += 20; }
      rr(x, y, w, h, 24); c.fillStyle = p.color; c.fill(); c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 6, y + 6, w - 12, 150, 18); c.fill();
      if (f) { rr(x - 5, y - 5, w + 10, h + 10, 28); c.strokeStyle = '#fff'; c.lineWidth = 6; c.stroke(); }
      fitText(p.name, x + w / 2, y + 80, w - 24, 130, 40);
      fitText(p.items.length + ' questions', x + w / 2, y + 200, w - 20, 30, 22);
      for (k = 0; k < 3; k++) star(x + w / 2 - 34 + k * 34, y + 255, 12, k < (best[p.id] || 0) ? '#ffd21f' : 'rgba(255,255,255,0.35)');
    }
    if (start > 0) fitText('◀', 18, 260, 30, 30, 26); if (start + vis < N) fitText('▶', W - 18, 260, 30, 30, 26);
    fitText('Stickers: ' + stickers, 130, 478, 200, 30, 24);
    for (var s = 0; s < Math.min(stickers, 14); s++) star(290 + s * 36, 478, 14, ['#ffd21f', '#ff7eb6', '#6ee06e', '#4aa3ff', '#ff9a5c'][s % 5]);
  }

  function draw() {
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5aa9ff'); g.addColorStop(1, '#cfeaff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    var i;
    if (mode === 'title') {
      pal(W / 2, 150 + Math.sin(t * 3) * 6, 2.2);
      if (!PACKS.length) TV.panel('MY QUIZ', ['No lessons yet', 'Add questions in quizadmin.php, then come back', 'Back: menu'], '#ffd21f');
      else TV.panel('MY QUIZ', ['Questions and answers made by you', 'Pick the right answer with the arrow keys', 'Press OK to start'], '#ffd21f');
      return;
    }
    if (mode === 'menu') { if (!PACKS.length) { TV.panel('NO LESSONS', ['Add questions in quizadmin.php', 'Back: return'], '#ffd21f'); } else drawMenu(); return; }
    c.fillStyle = pk.color; c.beginPath(); c.arc(46, 40, 30, 0, 6.283); c.fill(); fitText(pk.name.charAt(0).toUpperCase(), 46, 41, 40, 40, 32);
    c.fillStyle = 'rgba(255,255,255,0.4)'; rr(650, 28, 260, 16, 8); c.fill(); c.fillStyle = '#ffd21f'; rr(650, 28, Math.max(16, 260 * (qn / Math.max(1, deck.length))), 16, 8); c.fill();
    c.font = 'bold 18px Arial, Helvetica, sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = '#fff'; c.fillText(pk.name + (mode === 'play' ? '  •  ' + STYLE_NAME[style] : ''), 90, 40);
    if (mode === 'play') {
      var txt = celebT > 0 ? q.full : q.prompt;
      fitText(txt, W / 2, 124, 880, 118, 56, celebT > 0 ? '#c9ffb0' : '#fff');
      if (hintOn || misses >= 2) { rr(120, 202, 720, 34, 17); c.fillStyle = 'rgba(255,255,255,0.85)'; c.fill(); c.font = 'bold 20px Arial, Helvetica, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#23304f'; c.fillText('Hint: ' + hintText(), W / 2, 220); }
      if (style === 'tap') drawTap(); else if (style === 'door') drawDoor(); else if (style === 'catch') drawCatch(); else drawBalloons();
      if (style === 'catch') fitText('Left / Right: move the basket.  OK: drop it faster', W / 2, 530, 700, 24, 18);
      else if (style === 'balloon') fitText('Arrows: move.  OK: pop', W / 2, 530, 700, 24, 18);
      if (wrongT > 0) fitText('Try again!', W / 2, 252, 300, 40, 34, '#ffe08a');
    }
    if (mode === 'result') {
      TV.panel(res.stars === 3 ? 'AMAZING!' : res.stars === 2 ? 'WELL DONE!' : 'GOOD TRY!', [res.first + ' of ' + res.total + ' right on the first try', missed ? 'The ones you missed came back, and you got them' : 'No question needed a second go', 'You earned a sticker. OK: play again   Back: menu'], pk.color);
      for (i = 0; i < 3; i++) star(W / 2 - 60 + i * 60, 118, 24, i < res.stars ? '#ffd21f' : 'rgba(255,255,255,0.3)');
    }
    for (i = 0; i < parts.length; i++) { c.fillStyle = parts[i].col; c.fillRect(parts[i].x, parts[i].y, parts[i].r, parts[i].r * 1.5); }
  }

  TV.loop(update, draw);
})();
