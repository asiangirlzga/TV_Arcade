<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Rush</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>

    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';

    function off(e) { e.preventDefault(); b.className = 'pb'; fire('up', k, false); }

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);

  };
  T.dual = false;
  T.pick = function (d2, d3) {

    return function () { if (T.view() === '2d') d2(); else d3(); };
  };

  T.loop = function (update, draw) {

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);

  };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>

<script>

  var rows = [], nextRow = 30, seed = 1, flashT = 0, flashMsg = '', sideSeed = 7;

  function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function laneX(l) { return (l - 1) * LANE; }

  function reset() {
    rows = []; nextRow = 36; dist = 0; speed = 16; coins = 0; score = 0; lane = 1; px = 0; py = 0; vy = 0; onGround = true;
    slideT = 0; hit = 0; inv = 0; guardT = 0; shake = 0; seed = 1 + Math.floor(Math.random() * 99999);
    while (nextRow < 150) addRow();
  }

  /* One row = something in each of the three tracks. At least one track is always clear or can be jumped/slid. */
  var T_TRAIN = 1, T_LOW = 2, T_HIGH = 3;
  function addRow() {
    var r = { d: nextRow, o: [0, 0, 0], coin: [0, 0, 0], col: 0 }, free = Math.floor(rand() * 3), k, kind = rand();
    var pat = rand();
    for (k = 0; k < 3; k++) {
      if (k === free) continue;
      if (pat < 0.45) r.o[k] = T_TRAIN;
      else if (pat < 0.75) r.o[k] = (rand() < 0.5) ? T_LOW : T_HIGH;
      else r.o[k] = rand() < 0.5 ? T_TRAIN : (rand() < 0.5 ? T_LOW : T_HIGH);
    }
    if (kind < 0.35) { r.o[0] = r.o[1] = r.o[2] = 0; r.o[free] = rand() < 0.5 ? T_LOW : T_HIGH; free = (free + 1 + Math.floor(rand() * 2)) % 3; }
    if (kind > 0.8) { var q = rand() < 0.5 ? T_LOW : T_HIGH; for (k = 0; k < 3; k++) r.o[k] = q; r.o[free] = 0; }
    r.col = Math.floor(rand() * 4);
    r.coin[free] = 1 + Math.floor(rand() * 2);
    rows.push(r);
    nextRow += 18 + rand() * 12;
  }

  var TRAINCOL = ['#c8453b', '#3b82c8', '#d8a02a', '#4aa07a'];

  function pause() { if (state === PLAY) state = PAUSE; else if (state === PAUSE) state = PLAY; }
  function go() { reset(); state = PLAY; flashMsg = ''; }
  function jump() { if (onGround && state === PLAY) { vy = 11.2; onGround = false; slideT = 0; TV.beep(520, 0.12, 'square', 0.08, 360); } else if (!onGround) { slideT = 0; } }
  function slide() { if (state !== PLAY) return; if (!onGround) { vy = Math.min(vy, -14); } slideT = 0.75; TV.beep(200, 0.1, 'sawtooth', 0.07, -80); }

  TV.on(function (type, key, rep) {
    if (type !== 'down') return;
    if (key === 'back') { if (state === PLAY) pause(); else if (state === PAUSE) TV.exit(); else TV.exit(); return; }
    if (state === TITLE || state === OVER) { if (key === 'ok' || key === 'start') go(); return; }
    if (state === PAUSE) { if (key === 'ok' || key === 'start') pause(); return; }
    if (key === 'left' && lane > 0) { lane--; TV.beep(330, 0.05, 'triangle', 0.07); }
    else if (key === 'right' && lane < 2) { lane++; TV.beep(330, 0.05, 'triangle', 0.07); }
    else if (key === 'up' || key === 'ok') jump();
    else if (key === 'down') slide();
    else if (key === 'start') pause();
  });

  /* swipes on touch screens */
  var tx = 0, ty = 0;
  TV.cv.addEventListener('touchstart', function (e) { var p = e.changedTouches[0]; tx = p.clientX; ty = p.clientY; }, false);
  TV.cv.addEventListener('touchend', function (e) {
    var p = e.changedTouches[0], dx = p.clientX - tx, dy = p.clientY - ty;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { TV.fire('down', 'ok'); return; }
    if (Math.abs(dx) > Math.abs(dy)) TV.fire('down', dx > 0 ? 'right' : 'left'); else TV.fire('down', dy > 0 ? 'down' : 'up');
  }, false);

  function crash() {
    if (inv > 0) return;
    TV.beep(110, 0.3, 'sawtooth', 0.15, -60); shake = 0.5;
    if (hit === 0) { hit = 1; guardT = 7; inv = 1.4; speed = Math.max(13, speed * 0.7); flashMsg = 'Watch out! The guard is close'; flashT = 2; }
    else { state = OVER; if (score > best) { best = score; TV.store.set('subway_best', best); } }
  }

  function update(dt) {
    t += dt;
    if (dt > 0.05) dt = 0.05;
    if (state !== PLAY) return;
    run += dt * speed * 0.9;
    speed = Math.min(36, speed + dt * 0.35);
    dist += speed * dt;
    px += (laneX(lane) - px) * Math.min(1, dt * 14);
    if (!onGround || vy > 0) { vy -= 30 * dt; py += vy * dt; if (py <= 0) { py = 0; vy = 0; onGround = true; } }
    if (slideT > 0) slideT -= dt;
    if (inv > 0) inv -= dt;
    if (guardT > 0) { guardT -= dt; if (guardT <= 0) hit = 0; }
    if (shake > 0) shake -= dt;
    if (flashT > 0) flashT -= dt;
    while (nextRow < dist + 150) addRow();
    while (rows.length && rows[0].d < dist - 12) rows.shift();
    var i, k, r, rel, sliding = slideT > 0;
    for (i = 0; i < rows.length; i++) {
      r = rows[i]; rel = r.d - dist;
      for (k = 0; k < 3; k++) {
        var ox = laneX(k), same = Math.abs(px - ox) < 1.25;
        var o = r.o[k];
        if (!o || !same) continue;
        if (o === T_TRAIN && rel < 3.2 && rel > -3.2 && py < 3.4) { crash('train'); }
        else if (o === T_LOW && rel < 0.7 && rel > -0.7 && py < 1.0) { crash('barrier'); }
        else if (o === T_HIGH && rel < 0.7 && rel > -0.7 && !sliding) { crash('bar'); }
      }
      /* coins: 5 along the row's free lane */
      for (k = 0; k < 3; k++) {
        if (!r.coin[k]) continue;
        if (Math.abs(px - laneX(k)) > 1.4) continue;
        var m;
        for (m = 0; m < 6; m++) {
          var bit = 1 << m;
          if (r.taken === undefined) r.taken = [0, 0, 0];
          if (r.taken[k] & bit) continue;
          var cz = rel + (m - 2.5) * 2.2 - 3;
          if (cz < 1.0 && cz > -1.2 && py < 2.6 + 0.6) { r.taken[k] |= bit; coins++; TV.beep(900 + m * 60, 0.05, 'square', 0.06); }
        }
      }
    }
    score = Math.floor(dist) + coins * 10;
  }

  /* ----------------------------------------------------------------- drawing */
  function zOf(d) { return -(d - dist); }

  function building(x, z, hs, wd, col, win) {
    G.box(x, hs / 2, z, wd, hs, wd, col);
    G.box(x, hs + 0.2, z, wd * 1.04, 0.4, wd * 1.04, win, 0.7);
  }

  function drawWorld() {
    var i, k, m, z0 = 14, z1 = -150;
    var sh = shake > 0 ? Math.sin(t * 60) * 0.12 * shake : 0;
    G.camera([px * 0.55 + sh, 5.3, 9.5], [px * 0.7, 1.4, -14], 62);
    G.fog('#ff9a5c', 40, 150); G.light(0.55);
    G.sky('#2b1b5a', '#ff9a5c', H * 0.52);
    /* ground: dark bed, three rails pairs, side platforms */
    G.quad([-30, -0.05, z0], [30, -0.05, z0], [30, -0.05, z1], [-30, -0.05, z1], '#2e2b36');
    G.quad([-6.2, 0.0, z0], [6.2, 0.0, z0], [6.2, 0.0, z1], [-6.2, 0.0, z1], '#4a4650');
    for (k = 0; k < 3; k++) {
      var cx = laneX(k);
      for (m = 0; m < 2; m++) {
        var rx = cx + (m ? 0.72 : -0.72);
        G.quad([rx - 0.07, 0.04, z0], [rx + 0.07, 0.04, z0], [rx + 0.07, 0.04, z1], [rx - 0.07, 0.04, z1], '#b8b8c4');
      }
      var off = (dist % 2.4);
      for (i = 0; i < 60; i++) {
        var sz = z0 - i * 2.4 + off;
        G.quad([cx - 1.2, 0.02, sz + 0.2], [cx + 1.2, 0.02, sz + 0.2], [cx + 1.2, 0.02, sz - 0.2], [cx - 1.2, 0.02, sz - 0.2], '#5a4632');
      }
    }
    G.quad([-8.5, 0.3, z0], [-6.2, 0.3, z0], [-6.2, 0.3, z1], [-8.5, 0.3, z1], '#8a8590');
    G.quad([6.2, 0.3, z0], [8.5, 0.3, z0], [8.5, 0.3, z1], [6.2, 0.3, z1], '#8a8590');
    G.box(-6.3, 0.15, -60, 0.2, 0.3, 160, '#6f6a78'); G.box(6.3, 0.15, -60, 0.2, 0.3, 160, '#6f6a78');

    /* scenery: buildings and lamp posts, repeating every 14 units */
    var base = Math.floor(dist / 14), n;
    for (n = -1; n < 11; n++) {
      var idx = base + n, zz = -((idx * 14) - dist);
      var side;
      for (side = -1; side <= 1; side += 2) {
        var hh = 6 + hash(idx * 3 + side) * 14, wd = 5 + hash(idx * 5 + side * 2) * 3;
        var pal = ['#46405e', '#5b4a6e', '#3d4b6b', '#6a4a5a'][Math.floor(hash(idx + side * 9) * 4)];
        building(side * (12.5 + wd / 2), zz, hh, wd, pal, '#ffcf70');
      }
      if (idx % 2 === 0) {
        G.box(-7.7, 2, zz + 3, 0.2, 4, 0.2, '#2a2a34'); G.box(-7.2, 4.0, zz + 3, 1.2, 0.2, 0.2, '#2a2a34'); G.box(-6.7, 3.85, zz + 3, 0.5, 0.2, 0.5, '#fff1b0', 1);
        G.box(7.7, 2, zz + 3, 0.2, 4, 0.2, '#2a2a34'); G.box(7.2, 4.0, zz + 3, 1.2, 0.2, 0.2, '#2a2a34'); G.box(6.7, 3.85, zz + 3, 0.5, 0.2, 0.5, '#fff1b0', 1);
      }
    }

    /* rows */
    for (i = 0; i < rows.length; i++) {
      var r = rows[i], rz = zOf(r.d);
      if (rz > 12 || rz < -148) continue;
      for (k = 0; k < 3; k++) {
        var x = laneX(k), o = r.o[k];
        if (o === T_TRAIN) {
          var col = TRAINCOL[(r.col + k) % 4];
          G.box(x, 2.0, rz + 2.6, 2.5, 3.6, 4.7, col);
          G.box(x, 2.0, rz - 2.6, 2.5, 3.6, 4.7, col);
          G.box(x, 3.5, rz, 2.4, 0.4, 10.4, '#ddd');
          G.box(x, 2.6, rz + 5.2, 1.8, 1.0, 0.1, '#ffe9a0', 1);
          G.box(x, 2.6, rz - 5.2, 1.8, 1.0, 0.1, '#ffe9a0', 1);
        } else if (o === T_LOW) {
          G.box(x, 0.45, rz, 2.5, 0.9, 0.7, '#e8c020'); G.box(x, 0.45, rz + 0.36, 2.0, 0.25, 0.04, '#222');
        } else if (o === T_HIGH) {
          G.box(x - 1.15, 1.1, rz, 0.2, 2.2, 0.3, '#555'); G.box(x + 1.15, 1.1, rz, 0.2, 2.2, 0.3, '#555');
          G.box(x, 2.1, rz, 2.6, 0.7, 0.45, '#d8453b'); G.box(x, 2.1, rz + 0.24, 2.0, 0.2, 0.04, '#fff');
        }
        if (r.coin[k]) {
          for (m = 0; m < 6; m++) {
            if (r.taken && (r.taken[k] & (1 << m))) continue;
            var cz = zOf(r.d + (m - 2.5) * 2.2 - 3);
            var w = Math.abs(Math.sin(t * 4 + m)) * 0.7 + 0.15;
            G.box(x, 1.2, cz, w, 0.75, 0.15, '#ffd21f', 0.6);
          }
        }
      }
    }
    /* runner + guard */
    drawRunner();
    if (guardT > 0) {
      var gz = 2.6 + Math.sin(t * 9) * 0.1;
      G.box(px * 0.6, 1.0, gz, 0.8, 1.4, 0.5, '#2a3f8a'); G.box(px * 0.6, 2.0, gz, 0.5, 0.5, 0.5, '#e2b690'); G.box(px * 0.6, 2.35, gz, 0.6, 0.2, 0.6, '#1c2a62');
    }
    G.flush();
  }

  function drawRunner() {
    if (inv > 0 && Math.floor(t * 16) % 2 === 0) return;
    var sl = slideT > 0, sw = Math.sin(run * 3.2) * (onGround ? 0.45 : 0.1), h = sl ? 0.55 : 1.0;
    G.shadow(px, 0, 1.0, 1.0, 0.04);
    var y = py;
    if (sl) {
      G.box(px, y + 0.35, 0.1, 0.9, 0.5, 1.3, '#2fa0e0');
      G.box(px, y + 0.5, -0.65, 0.5, 0.5, 0.5, '#f0b98a'); G.box(px, y + 0.8, -0.65, 0.58, 0.2, 0.56, '#e83d3d');
      G.box(px, y + 0.15, 0.85, 0.5, 0.25, 0.7, '#2a3f8a');
    } else {
      G.box(px - 0.22, y + 0.4, sw * 0.7, 0.3, 0.8, 0.34, '#2a3f8a');
      G.box(px + 0.22, y + 0.4, -sw * 0.7, 0.3, 0.8, 0.34, '#2a3f8a');
      G.box(px, y + 1.15, 0, 0.8, 0.8, 0.46, '#2fa0e0');
      G.box(px - 0.52, y + 1.2, -sw * 0.6, 0.2, 0.7, 0.24, '#2fa0e0'); G.box(px + 0.52, y + 1.2, sw * 0.6, 0.2, 0.7, 0.24, '#2fa0e0');
      G.box(px, y + 1.8, 0, 0.5, 0.5, 0.5, '#f0b98a');
      G.box(px, y + 2.1, -0.02, 0.58, 0.2, 0.58, '#e83d3d'); G.box(px, y + 2.03, -0.3, 0.5, 0.08, 0.3, '#e83d3d');
      G.box(px, y + 1.25, 0.3, 0.5, 0.6, 0.18, '#ffd21f');
    }
  }

  function hud() {
    TV.text('SCORE ' + score, 18, 26, 24, '#fff', 'left');
    TV.text('COINS ' + coins, 18, 54, 20, '#ffd21f', 'left');
    TV.text('BEST ' + best, W - 18, 26, 20, '#cfd6ff', 'right');
    if (hit) TV.text('GUARD CLOSE', W - 18, 54, 20, '#ff7b6e', 'right');
    if (flashT > 0) TV.text(flashMsg, W / 2, 96, 24, '#fff', 'center');
  }

  function draw() {
    drawWorld();
    if (state === PLAY) hud();
    else if (state === TITLE) TV.panel('SUBWAY RUSH', ['Press OK to run', 'Left / Right: change track', 'Up: jump over barriers', 'Down: slide under bars, trains need a lane change'], '#ffd21f');
    else if (state === OVER) TV.panel('CAUGHT!', ['Score ' + score + '   Coins ' + coins, 'Best ' + best, 'Press OK to run again'], '#ff5a4e');
    else if (state === PAUSE) { hud(); TV.panel('PAUSED', ['OK: resume', 'Back: return to the menu'], '#44b8ff'); }
  }

  reset();
  TV.loop(update, draw);
})();
</script>
