<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick Smash</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>

    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {

    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);

  T.loop = function (update, draw) {

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };

  };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {

  };

  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>

<script>
(function () {
  var c = TV.ctx, W = TV.W, H = TV.H;
  var state = 'title', pad, ball, bricks, lives, score, level, best = TV.store.get('brick_best', 0), stuck, rows = ['#ff5a4e', '#ff9f43', '#ffd21f', '#5CC94A', '#44b8ff'];

  function build() {
    bricks = [];
    var n = Math.min(5 + Math.floor(level / 2), 7);
    for (var r = 0; r < n; r++) for (var i = 0; i < 12; i++) bricks.push({ x: 40 + i * 74, y: 70 + r * 30, w: 68, h: 24, col: rows[r % rows.length], hp: (level > 2 && r === 0) ? 2 : 1 });
  }
  function serve() { stuck = true; ball = { x: pad.x, y: H - 62, vx: 0, vy: 0, r: 9 }; }
  function newGame() { pad = { x: W / 2, w: 120, h: 14, v: 0 }; lives = 3; score = 0; level = 1; build(); serve(); state = 'play'; }
  function launch() { if (!stuck) return; stuck = false; var sp = 380 + level * 25; ball.vx = sp * 0.35; ball.vy = -sp; TV.beep(500, 0.08, 'square', 0.1, 700); }

  TV.on(function (type, key, rep) {
    if (type !== 'down' || rep) return;
    if (key === 'back') { if (state === 'play') state = 'pause'; else TV.exit(); return; }
    if (state === 'title' || state === 'over' || state === 'won') { if (key === 'ok' || key === 'start') newGame(); return; }
    if (state === 'pause') { if (key === 'ok' || key === 'start') state = 'play'; return; }
    if (key === 'ok') launch(); else if (key === 'start') state = 'pause';
  });

  function loseBall() {
    lives--; TV.beep(150, 0.3, 'sawtooth', 0.14, 60);
    if (lives <= 0) { state = 'over'; if (score > best) { best = score; TV.store.set('brick_best', best); } } else serve();
  }
  function update(dt) {
    if (state !== 'play') return;
    var dir = (TV.held.right ? 1 : 0) - (TV.held.left ? 1 : 0);
    pad.v += (dir * 620 - pad.v) * Math.min(1, 14 * dt);
    pad.x = TV.clamp(pad.x + pad.v * dt, pad.w / 2 + 8, W - pad.w / 2 - 8);
    if (stuck) { ball.x = pad.x; return; }
    var steps = 3, h = dt / steps;
    for (var s = 0; s < steps; s++) {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < ball.r + 40) { ball.y = ball.r + 40; ball.vy = Math.abs(ball.vy); }
      if (ball.vy > 0 && ball.y + ball.r >= H - 40 - pad.h && ball.y < H - 30 && Math.abs(ball.x - pad.x) < pad.w / 2 + ball.r) {
        var off = (ball.x - pad.x) / (pad.w / 2), sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 1.01;
        var ang = off * 1.05; ball.vx = Math.sin(ang) * sp; ball.vy = -Math.cos(ang) * sp; ball.y = H - 40 - pad.h - ball.r; TV.beep(330, 0.05, 'square', 0.08);
      }
      for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          var ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r)), oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
          b.hp--; score += 10; TV.beep(600 + (5 - i % 5) * 60, 0.05, 'square', 0.08);
          if (b.hp <= 0) bricks.splice(i, 1);
          break;
        }
      }
      if (ball.y - ball.r > H) { loseBall(); return; }
    }
    if (!bricks.length) { level++; score += 100; build(); serve(); TV.beep(900, 0.3, 'square', 0.12, 1400); }
  }
  var K = 0.05;
  function X(x) { return (x - W / 2) * K; }
  function Z(y) { return (y - H / 2) * K; }
  function draw2() {
    c.fillStyle = '#0f1a3d'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#18224a'; c.fillRect(0, 0, W, 40);
    TV.text('SCORE ' + (score || 0), 16, 20, 20, '#fff', 'left');
    TV.text('LEVEL ' + (level || 1), W / 2, 20, 20, '#aeb7da');
    var hearts = ''; for (var l = 0; l < (lives || 0); l++) hearts += '♥ ';
    TV.text(hearts, W - 16, 20, 22, '#ff5a4e', 'right');
    if (bricks) for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i]; c.fillStyle = b.col; c.fillRect(b.x, b.y, b.w, b.h);
      c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(b.x, b.y, b.w, 5);
      if (b.hp > 1) { c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4); }
    }
    if (pad) { c.fillStyle = '#f3efe4'; c.fillRect(pad.x - pad.w / 2, H - 40 - pad.h, pad.w, pad.h); c.fillStyle = '#44b8ff'; c.fillRect(pad.x - pad.w / 2, H - 40 - pad.h, pad.w, 4); }
    if (ball) { c.fillStyle = '#fff'; c.beginPath(); c.arc(ball.x, ball.y, ball.r, 0, 6.3); c.fill(); }
    if (state === 'play' && stuck) TV.text('Press OK to launch', W / 2, H * 0.62, 26, '#ffd21f');
    if (state === 'title') TV.panel('BRICK SMASH', ['Press OK to start', 'Left and Right move the paddle', 'Best ' + best], '#ff7a45');
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to play again', 'Back: menu'], '#ff5a4e');
  }
  var draw = TV.pick(draw2, draw3);
  function draw3() {
    var G = TV3D, i;
    c.fillStyle = '#0b1030'; c.fillRect(0, 0, W, H);
    G.camera([0, 27, 23], [0, 0, 2.5], 46); G.fog('#0b1030', 50, 110); G.light(0.55);
    G.cached('brick', function (g) {
      var hw = W * K / 2 + 0.5, hd = H * K / 2;
      G.quadTo(g, [-hw, 0, hd], [hw, 0, hd], [hw, 0, -hd], [-hw, 0, -hd], '#16224f');
      for (var k = -9; k <= 9; k++) G.quadTo(g, [k * 2.4 - 0.05, 0.01, hd], [k * 2.4 + 0.05, 0.01, hd], [k * 2.4 + 0.05, 0.01, -hd], [k * 2.4 - 0.05, 0.01, -hd], '#1b2b63');
    });
    var hw2 = W * K / 2, hd2 = H * K / 2;
    G.box(-hw2 - 0.4, 0.6, 0, 0.8, 1.2, hd2 * 2 + 0.8, '#2c3b78'); G.box(hw2 + 0.4, 0.6, 0, 0.8, 1.2, hd2 * 2 + 0.8, '#2c3b78'); G.box(0, 0.6, -hd2 - 0.4, hw2 * 2 + 1.6, 1.2, 0.8, '#2c3b78');
    if (bricks) for (i = 0; i < bricks.length; i++) {
      var b = bricks[i]; G.box(X(b.x + b.w / 2), 0.55, Z(b.y + b.h / 2), b.w * K - 0.12, b.hp > 1 ? 1.5 : 1.1, b.h * K - 0.12, b.hp > 1 ? '#f3efe4' : b.col);
    }
    if (pad) { G.box(X(pad.x), 0.4, Z(H - 40 - pad.h / 2), pad.w * K, 0.8, 0.8, '#f3efe4'); G.box(X(pad.x), 0.85, Z(H - 40 - pad.h / 2), pad.w * K, 0.1, 0.8, '#44b8ff', 0.3); }
    if (ball) { G.shadow(X(ball.x), Z(ball.y), 0.9, 0.9); G.prismY(X(ball.x), 0.6, Z(ball.y), 0.9, 0.9, 0.9, '#ffffff', 0.5); }
    G.flush();
    TV.text('SCORE ' + (score || 0), 16, 20, 20, '#fff', 'left');
    TV.text('LEVEL ' + (level || 1), W / 2, 20, 20, '#aeb7da');
    var hearts = ''; for (var l = 0; l < (lives || 0); l++) hearts += '\u2665 ';
    TV.text(hearts, W - 16, 20, 22, '#ff5a4e', 'right');
    if (state === 'play' && stuck) TV.text('Press OK to launch', W / 2, H * 0.50, 26, '#ffd21f');
    if (state === 'title') TV.panel('BRICK SMASH 3D', ['Press OK to start', 'Left and Right move the paddle', 'Best ' + best], '#ff7a45');
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to play again', 'Back: menu'], '#ff5a4e');
  }
  TV.loop(update, draw);
})();
</script>
