<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Train Rush</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';
/* ---------- TV: input, loop, audio, helpers ---------- */
var TV = (function () {
  var T = {}, cv = document.getElementById('c'), handlers = [], held = {}, actx = null, muted = false;
  T.cv = cv; T.ctx = cv.getContext('2d'); T.W = cv.width; T.H = cv.height; T.held = held; T.hint = "Left\/Right change track. Up faster, Down brake, OK horn, Back pauses.";

  function norm(e) {
    var k = e.key, c = e.keyCode || e.which;
    if (k === 'ArrowLeft' || c === 37 || c === 21 || k === 'a' || k === 'A') return 'left';
    if (k === 'ArrowRight' || c === 39 || c === 22 || k === 'd' || k === 'D') return 'right';
    if (k === 'ArrowUp' || c === 38 || c === 19 || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';

  }

    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('down', k, e.repeat);

    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('up', k, false);

  window.addEventListener('touchstart', function () { document.documentElement.className = 'touch'; T.fit(); }, false);
  var btns = document.querySelectorAll('.pb');

    var k = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); b.className = 'pb on'; fire('down', k, false); }
    function off(e) { e.preventDefault(); b.className = 'pb'; fire('up', k, false); }
    b.addEventListener('touchstart', on, false); b.addEventListener('touchend', off, false); b.addEventListener('touchcancel', off, false);
    b.addEventListener('mousedown', on, false); b.addEventListener('mouseup', off, false); b.addEventListener('mouseleave', off, false);

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);
    if (m) return m[1];
    return T.store.get('view', '3d') === '2d' ? '2d' : '3d';
  };
  T.dual = false;
  T.pick = function (d2, d3) {
    T.dual = true; var vw = document.getElementById('vw'); if (vw) vw.style.display = '';
    return function () { if (T.view() === '2d') d2(); else d3(); };
  };
  T.on(function (type, key) {
    if (type !== 'down' || key !== 'view' || !T.dual) return;
    var n = T.view() === '2d' ? '3d' : '2d'; T.store.set('view', n);
    if (window.history && history.replaceState) { try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ } }

  });

  T.loop = function (update, draw) {
    var last = 0;
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;

  T.toast = function (msg, ms) {

    clearTimeout(T._tt); T._tt = setTimeout(function () { el.style.opacity = 0; }, ms || 4000);
  };

  T.store = {
    get: function (k, d) { try { var v = window.localStorage.getItem('tvarcade_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem('tvarcade_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };
  T.setMuted = function (m) { muted = !!m; };
  T.isMuted = function () { return muted; };
  T.beep = function (freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.1, t); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* no audio */ }
  };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);
    T.text(title, T.W / 2, T.H * 0.30, 64, accent || '#ffd21f');
    for (var i = 0; i < lines.length; i++) T.text(lines[i], T.W / 2, T.H * 0.46 + i * 38, 26, '#dfe5ff');
  };
  T.rnd = function (a, b) { return a + Math.random() * (b - a); };
  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>

<script>
(function () {
  'use strict';

  var T_COIN = 0, T_BOOST = 1, T_BARRIER = 2, T_ROCK = 3, T_WAGON = 4, T_TRAIN = 5;
  var LANE_W = 2.6, PLAYER_FRONT_Z = -4.6, PLAYER_BACK_Z = 6.2, SPAWN_Z = -105, DESPAWN_Z = 16;
  var MAX_E = 56, N_SC = 36, N_PUFF = 10, PUFF_LIFE = 1.2;
  var SLEEPER_GAP = 2.2, SLEEPERS = 50;
  var WHITE = '#F2F2F2', DARK = '#242429', SMOKE = [235, 235, 235], LAMP = '#FFF299', BOOST_COL = '#33D9FF';

    var ang = scroll / 0.45, k, wz;
    for (k = 0; k < (detail ? 3 : 2); k++) {
      wz = zc + fz * (1.5 - k * 1.4);
      G.prismX(x - 0.9, 0.5, wz, 0.22, 1.0, 1.0, DARK);
      G.prismX(x + 0.9, 0.5, wz, 0.22, 1.0, 1.0, DARK);
      if (detail) {
        var py = 0.5 + Math.cos(ang) * 0.3, pz = wz + Math.sin(ang) * 0.3;
        G.box(x - 1.05, py, pz, 0.1, 0.14, 0.14, accent);
        G.box(x + 1.05, py, pz, 0.1, 0.14, 0.14, accent);
      }
    }
  }

  function drawEntities(t) {
    var k, x, z, tp, bob, spin;
    for (k = 0; k < MAX_E; k++) {
      if (!eOn[k]) continue;
      x = eX[k]; z = eZ[k]; tp = eType[k];
      if (12.5 - z > t.fogEnd + 12) continue;
      if (tp === T_COIN) {
        spin = Math.abs(Math.cos(time * 5 + z * 0.3)) * 0.8 + 0.08;
        bob = 1.3 + 0.15 * Math.sin(time * 3 + z);
        G.prismZ(x, bob, z, spin, 0.8, 0.14, t.coin, 0.6);
      } else if (tp === T_BOOST) {
        bob = 1.2 + 0.2 * Math.sin(time * 3);
        G.prismY(x, bob, z, 0.9, 1.1, 0.9, BOOST_COL, 0.8);
        G.box(x, bob + 0.75, z, 0.45, 0.25, 0.45, WHITE, 0.8);
      } else if (tp === T_BARRIER) {
        G.box(x - 1.0, 0.8, z, 0.2, 1.6, 0.2, WHITE);
        G.box(x + 1.0, 0.8, z, 0.2, 1.6, 0.2, WHITE);
        G.box(x, 1.25, z, 2.3, 0.4, 0.2, t.barrier);
        G.box(x, 0.65, z, 2.3, 0.4, 0.2, WHITE);
      } else if (tp === T_ROCK) {
        G.pyramid(x, 0.8, z, 2.2, 1.7, 1.9, t.rock);
        G.box(x + 0.5, 0.35, z + 0.4, 0.9, 0.7, 0.8, t.rock);
      } else if (tp === T_WAGON) {
        G.box(x, 0.55, z, 1.6, 0.4, 6.0, t.enemy);
        G.box(x, 1.95, z - 1.65, 2.2, 2.4, 3.3, t.car);
        G.box(x, 1.95, z + 1.65, 2.2, 2.4, 3.3, t.car);
        G.box(x, 2.0, z - 1.65, 2.24, 0.4, 3.2, t.accent);
        G.box(x, 2.0, z + 1.65, 2.24, 0.4, 3.2, t.accent);
        G.box(x, 3.25, z, 2.3, 0.18, 6.8, t.enemy);
      } else {
        drawLoco(x, z, 1, t.enemy, t.accent, false);
      }
    }
  }

  function drawPlayer(t) {
    if (invuln > 0 && (Math.floor(time * 14) & 1) === 0) return;
    var x = px;
    drawLoco(x, -2.0, -1, t.train, t.accent, true);
    G.box(x, 0.55, 3.4, 1.5, 0.3, 5.4, DARK);
    G.box(x, 1.35, 1.7, 1.7, 1.5, 2.2, DARK);
    G.box(x, 2.2, 1.7, 1.4, 0.35, 1.9, t.accent);
    G.box(x, 2.0, 4.6, 1.9, 2.4, 2.8, t.car);
    G.box(x, 2.35, 4.6, 1.96, 0.55, 2.6, WHITE);
    G.box(x, 3.3, 4.6, 2.1, 0.14, 3.0, DARK);
  }

  function drawSmoke(t) {
    var fc = G.parse(t.skyBottom), k, age, kk, size, cc;
    for (k = 0; k < N_PUFF; k++) {
      age = pAge[k]; if (age >= PUFF_LIFE) continue;
      kk = age / PUFF_LIFE; size = 0.35 + 1.1 * kk; cc = 1 - 0.55 * kk;
      G.box(pX[k], pY[k], pZ[k], size, size, size,
        [SMOKE[0] * cc + fc[0] * (1 - cc) * 0.4, SMOKE[1] * cc + fc[1] * (1 - cc) * 0.4, SMOKE[2] * cc + fc[2] * (1 - cc) * 0.4], 0.3);
    }
  }

  function drawShadows(t) {
    if (quality === 0) return;
    G.shadow(px, 1.2, 2.2, 11, 0.37);
    if (quality < 2) return;
    for (var k = 0; k < MAX_E; k++) {
      if (!eOn[k] || eType[k] < T_BARRIER || 12.5 - eZ[k] > t.fogEnd) continue;
      var tp = eType[k];
      G.shadow(eX[k], eZ[k], tp === T_ROCK ? 2.4 : 2.4, tp === T_WAGON ? 7 : tp === T_TRAIN ? 5.4 : tp === T_ROCK ? 2 : 0.5, 0.37);
    }
  }

  /* ------------------------------------------------------------ HUD */
  function lab(s, x, y, size, color, align) { TV.text(s, x, y - size * 0.32, size, color, align); }
  function rr(x, y, w, h, r, color) {
    c.fillStyle = color; c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath(); c.fill();
  }
  function arrow(cx, cy, size, dir, color) {
    c.fillStyle = color; c.beginPath();
    c.moveTo(cx + dir * size, cy); c.lineTo(cx - dir * size * 0.6, cy - size); c.lineTo(cx - dir * size * 0.6, cy + size);
    c.closePath(); c.fill();
  }
  function heart(cx, cy, s, color) {
    c.fillStyle = color;
    c.beginPath(); c.arc(cx - s * 0.5, cy - s * 0.3, s * 0.55, 0, 6.2832); c.fill();
    c.beginPath(); c.arc(cx + s * 0.5, cy - s * 0.3, s * 0.55, 0, 6.2832); c.fill();
    c.beginPath(); c.moveTo(cx - s, cy - s * 0.1); c.lineTo(cx + s, cy - s * 0.1); c.lineTo(cx, cy + s * 1.1); c.closePath(); c.fill();
  }
  function drawHud() {
    var mx = W * 0.05, my = H * 0.06, hs = H * 0.022, k;
    lab(String(score), mx, my + H * 0.08, H * 0.09, '#FFFFFF', 'left');
    lab('SCORE', mx, my + H * 0.115, H * 0.03, '#DDDDDD', 'left');
    lab(String(coins), W - mx, my + H * 0.07, H * 0.07, '#FFD700', 'right');
    lab('COINS', W - mx, my + H * 0.105, H * 0.03, '#DDDDDD', 'right');
    for (k = 0; k < 3; k++) heart(W / 2 + (k - 1) * hs * 3.4, my + hs * 1.4, hs, k < lives ? '#FF4D4D' : 'rgba(255,255,255,.33)');
    lab(kmh + ' km/h', mx, H - my, H * 0.05, '#FFFFFF', 'left');
    if (boostLeft > 0) {
      var bw = W * 0.22, bh = H * 0.025, l = (W - bw) / 2, tt = H - my - bh;
      rr(l, tt, bw, bh, bh * 0.3, 'rgba(0,0,0,.4)');
      rr(l, tt, Math.max(bh, bw * Math.min(1, boostLeft / 4.5)), bh, bh * 0.3, '#33D9FF');
      lab('BOOST', W / 2, tt - H * 0.012, H * 0.035, '#33D9FF', 'center');
    }
  }
  function drawMenu() {
    var cx = W / 2, pl = W * 0.25, pr = W * 0.75, pt = H * 0.36, rowH = H * 0.1, k;
    lab('TRAIN RUSH', cx, H * 0.2, H * 0.15, '#FFFFFF', 'center');
    lab('LITE 3D', cx, H * 0.27, H * 0.05, '#FFD23F', 'center');
    rr(pl, pt, pr - pl, rowH * 3 + H * 0.04, H * 0.03, 'rgba(0,0,0,.6)');
    var names = ['Theme', 'Quality', 'Music'], vals = [theme.name, QUALITY[quality], music ? 'On' : 'Off'];
    for (k = 0; k < 3; k++) {
      var ry = pt + H * 0.02 + k * rowH, sel = menuRow === k, col = sel ? '#FFFFFF' : '#BBBBBB';
      if (sel) rr(pl + W * 0.01, ry, pr - pl - W * 0.02, rowH, H * 0.03, 'rgba(255,255,255,.33)');
      lab(names[k], pl + W * 0.03, ry + rowH * 0.66, H * 0.045, col, 'left');
      lab(vals[k], pr - W * 0.09, ry + rowH * 0.66, H * 0.045, col, 'right');
      if (sel) { arrow(pr - W * 0.075, ry + rowH * 0.5, H * 0.022, 1, '#FFD23F'); arrow(pl + W * 0.30, ry + rowH * 0.5, H * 0.022, -1, '#FFD23F'); }
    }
    c.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4);
    lab('Press OK to start', cx, H * 0.8, H * 0.06, '#FFFFFF', 'center');
    c.globalAlpha = 1;
    lab('UP/DOWN pick option   LEFT/RIGHT change   BACK exit', cx, H * 0.87, H * 0.032, '#DDDDDD', 'center');
    lab('In game:  LEFT/RIGHT change track   UP faster   DOWN brake   OK horn   BACK pause', cx, H * 0.915, H * 0.032, '#DDDDDD', 'center');
    lab('Best  ' + best, W * 0.05, H * 0.11, H * 0.045, '#FFD23F', 'left');
  }

  function draw() {
    if (quality === 0) { drawAcc += lastDt; if (drawAcc < 0.028) return; drawAcc = 0; }
    var t = theme, sx = 0, sy = 0;
    if (shake > 0) { sx = Math.sin(time * 70) * shake * 0.35; sy = Math.cos(time * 83) * shake * 0.25; }
    G.camera([px * 0.55 + sx, 5 + sy, 12.5], [px * 0.3, 1.2, -25], 58);
    G.fog(t.skyBottom, t.fogStart, t.fogEnd); G.light(t.ambient);
    G.sky(t.skyTop, t.skyBottom, 236);
    drawTrack(t);
    drawShadows(t);
    drawScenery(t);
    drawEntities(t);
    drawPlayer(t);
    drawSmoke(t);
    G.flush();
    if (state === MENU) drawMenu();
    else {
      drawHud();
      if (state === PAUSED) {
        c.fillStyle = 'rgba(0,0,0,.53)'; c.fillRect(0, 0, W, H);
        lab('PAUSED', W / 2, H * 0.47, H * 0.13, '#FFFFFF', 'center');
        lab('OK = continue      BACK = menu', W / 2, H * 0.58, H * 0.045, '#DDDDDD', 'center');
      } else if (state === OVER) {
        c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(0, 0, W, H);
        lab('GAME OVER', W / 2, H * 0.36, H * 0.14, '#FF6B5A', 'center');
        lab('Score  ' + score, W / 2, H * 0.52, H * 0.075, '#FFFFFF', 'center');
        lab(score >= best && score > 0 ? 'New best score!' : 'Best  ' + best, W / 2, H * 0.62, H * 0.05, '#FFD23F', 'center');
        lab('OK = play again      BACK = menu', W / 2, H * 0.76, H * 0.045, '#DDDDDD', 'center');
      }
    }
  }

  applyTheme();
  window.__train = { st: function () { return { state: state, score: score, coins: coins, lives: lives, theme: theme.id, quality: quality, music: music, kmh: kmh, best: best }; } };
  TV.loop(update, draw);
})();
</script>
