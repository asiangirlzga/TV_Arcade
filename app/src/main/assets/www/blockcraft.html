<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BlockCraft</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';

})();
</script>

    line3(x, y, z, x, y + s, z); line3(x + s, y, z, x + s, y + s, z); line3(x + s, y, z + s, x + s, y + s, z + s); line3(x, y, z + s, x, y + s, z + s);
    c.stroke();
  }

  function swatch(type, x, y, s) {
    c.fillStyle = COL[type][0]; c.fillRect(x, y, s, s * 0.35);
    c.fillStyle = COL[type][1]; c.fillRect(x, y + s * 0.35, s, s * 0.65);
    if (type === GLASS) { c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(x + 3, y + 3, s - 6, s - 6); }
  }
  function hud() {
    var cx = W / 2, cyy = HC;
    c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2; c.beginPath(); c.moveTo(cx - 9, cyy); c.lineTo(cx + 9, cyy); c.moveTo(cx, cyy - 9); c.lineTo(cx, cyy + 9); c.stroke();
    var n = HOT.length, s = 44, gap = 6, x0 = (W - n * (s + gap)) / 2, y0 = H - 82, k;
    for (k = 0; k < n; k++) {
      var x = x0 + k * (s + gap);
      c.fillStyle = 'rgba(0,0,0,0.45)'; c.fillRect(x - 3, y0 - 3, s + 6, s + 6);
      swatch(HOT[k], x, y0, s);
      if (k === sel) { c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(x - 4, y0 - 4, s + 8, s + 8); }
    }
    TV.text(HOTNAME[sel] + (lookMode ? '   [look mode]' : ''), W / 2, y0 - 12, 18, '#fff', 'center');
    if (msgT > 0) TV.text(msg, W / 2, 70, 22, '#fff', 'center');
    TV.text('x ' + Math.floor(px) + '  y ' + Math.floor(py) + '  z ' + Math.floor(pz), 14, 24, 16, 'rgba(255,255,255,0.85)', 'left');
  }

  function draw() {
    po = third ? -0.2 : 0; sY = Math.sin(yaw); cY = Math.cos(yaw); sP = Math.sin(pitch + po); cP = Math.cos(pitch + po);
    var hxp = px, hyp = py + EYE, hzp = pz, dv = eyeDir(), so, sd;
    if (third) {
      so = camS; if (solid(get(Math.floor(hxp + cY * so), Math.floor(hyp), Math.floor(hzp + sY * so)))) so = 0;
      hxp += cY * so; hzp += sY * so; camD = 5.6; HC = H / 2 - 40;
      for (sd = 0.3; sd <= 5.6; sd += 0.1) {
        if (solid(get(Math.floor(hxp - dv[0] * sd), Math.floor(hyp - dv[1] * sd), Math.floor(hzp - dv[2] * sd)))) { camD = Math.max(0.2, sd - 0.3); break; }
      }
      ex = hxp - dv[0] * camD; ey = hyp - dv[1] * camD; ez = hzp - dv[2] * camD;
    } else { camD = 0; HC = H / 2; ex = px; ey = py + EYE; ez = pz; }
    var g = c.createLinearGradient(0, 0, 0, H * 0.65); g.addColorStop(0, '#6fa8f0'); g.addColorStop(1, 'rgb(' + SKY[0] + ',' + SKY[1] + ',' + SKY[2] + ')');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    target();
    drawBlocks();
    outline();
    if (get(Math.floor(ex), Math.floor(ey), Math.floor(ez)) === WATER) { c.fillStyle = 'rgba(30,80,200,0.35)'; c.fillRect(0, 0, W, H); }
    if (state === PLAY) hud();
    else if (state === TITLE) TV.panel('BLOCKCRAFT', ['Press OK to start', 'Up/Down walk, Left/Right turn', 'OK breaks a block, 1 places, 2 jumps', '3 changes block, 4 lets Up/Down look up and down', 'V key (or Cam button): switch camera'], '#5da83a');
    else TV.panel('PAUSED', ['OK: continue', 'Back: return to the menu', 'Your building is saved on this device'], '#44b8ff');
  }

  build(); applyEdits(); spawn(); placeMobs();
  TV.loop(update, draw);
})();
</script>
