<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Driving School</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';
/* ---------- TV: input, loop, audio, helpers ---------- */
var TV = (function () {
  var T = {}, cv = document.getElementById('c'), handlers = [], held = {}, actx = null, muted = false;
  T.cv = cv; T.ctx = cv.getContext('2d'); T.W = cv.width; T.H = cv.height; T.held = held; T.hint = "UP = gas, DOWN = brake, LEFT\/RIGHT steer, OK = gear, 1\/3 indicators, 2 hazard, 4 horn, Back = pause.";

  /* Turn any key (TV remote, keyboard, game pad app) into: left right up down ok back start */
  function norm(e) {
    var k = e.key, c = e.keyCode || e.which;
    if (k === 'ArrowLeft' || c === 37 || c === 21 || k === 'a' || k === 'A') return 'left';
    if (k === 'ArrowRight' || c === 39 || c === 22 || k === 'd' || k === 'D') return 'right';
    if (k === 'ArrowUp' || c === 38 || c === 19 || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';
    if (k === 'v' || k === 'V') return 'view';
    if (k === 'p' || k === 'P' || c === 80 || c === 108 || c === 415 || c === 179) return 'start';
    return '';
  }
  function fire(type, key, rep) {
    if (type === 'down') { if (!rep) held[key] = true; } else held[key] = false;
    for (var i = 0; i < handlers.length; i++) { try { handlers[i](type, key, !!rep); } catch (err) { if (window.console) console.error(err); } }
  }
  T.on = function (fn) { handlers.push(fn); };
  T.fire = fire;
  window.addEventListener('keydown', function (e) {
    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('down', k, e.repeat);
  }, false);
  window.addEventListener('keyup', function (e) {
    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('up', k, false);
  }, false);

  /* Touch pad for phones and tablets */
  window.addEventListener('touchstart', function () { document.documentElement.className = 'touch'; T.fit(); }, false);
  var btns = document.querySelectorAll('.pb');
  for (var i = 0; i < btns.length; i++) (function (b) {
    var k = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); b.className = 'pb on'; fire('down', k, false); }
    function off(e) { e.preventDefault(); b.className = 'pb'; fire('up', k, false); }
    b.addEventListener('touchstart', on, false); b.addEventListener('touchend', off, false); b.addEventListener('touchcancel', off, false);
    b.addEventListener('mousedown', on, false); b.addEventListener('mouseup', off, false); b.addEventListener('mouseleave', off, false);
  })(btns[i]);
  document.getElementById('exit').addEventListener('click', function () { T.exit(); }, false);

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);
    if (m) return m[1];
    return T.store.get('view', '3d') === '2d' ? '2d' : '3d';
  };
  T.dual = false;
  T.pick = function (d2, d3) {
    T.dual = true; var vw = document.getElementById('vw'); if (vw) vw.style.display = '';
    return function () { if (T.view() === '2d') d2(); else d3(); };
  };
  T.on(function (type, key) {
    if (type !== 'down' || key !== 'view' || !T.dual) return;
    var n = T.view() === '2d' ? '3d' : '2d'; T.store.set('view', n);
    if (window.history && history.replaceState) { try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ } }
    T.toast('View: ' + n.toUpperCase(), 1500);
  });

  T.loop = function (update, draw) {
    var last = 0;
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      update(dt); draw();
      window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
  };

  T.toast = function (msg, ms) {
    var el = document.getElementById('toast'); el.textContent = msg; el.style.opacity = 1;
    clearTimeout(T._tt); T._tt = setTimeout(function () { el.style.opacity = 0; }, ms || 4000);
  };

  T.store = {
    get: function (k, d) { try { var v = window.localStorage.getItem('tvarcade_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem('tvarcade_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };
  T.setMuted = function (m) { muted = !!m; };
  T.isMuted = function () { return muted; };
  T.beep = function (freq, dur, type, vol, slide) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.linearRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(vol || 0.1, t); g.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* no audio */ }
  };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);
    T.text(title, T.W / 2, T.H * 0.30, 64, accent || '#ffd21f');
    for (var i = 0; i < lines.length; i++) T.text(lines[i], T.W / 2, T.H * 0.46 + i * 38, 26, '#dfe5ff');
  };
  T.rnd = function (a, b) { return a + Math.random() * (b - a); };
  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>
<script>
(function () {
  var ctx = TV.ctx, w = TV.W, h = TV.H;

  /* ---------------- constants (same numbers as the Android game) ---------------- */
  var SEG = 200, T = 1800, NC = 40, MAXD = 110, NMIN = 3, CARL = 900, NOSE = 900;
  var TLEN = SEG * T, RW = 2000, CAMH = 1000, DEPTH = 0.84, CAMBACK = 840, KU = 60, MAXK = 120, MPS = 3;
  var S_MENU = 0, S_PLAY = 1, S_PAUSE = 2, S_RESULT = 3;
  var G_P = 0, G_R = 1, G_N = 2, G_D = 3;
  var NEXT_GEAR = [G_D, G_N, G_P, G_R];
  var GEARS = ['P', 'R', 'N', 'D'];
  var LIM = [40, 60, 50, 30, 60, 40];
  var LANEX = [-0.667, 0, 0.667];
  var LANEK = [25, 40, 55];
  var PAL = [0x8B7765, 0x6D7A86, 0xA08F7E, 0x566372, 0xB3A38F, 0x7C6A62];
  var CARC = [0xC0392B, 0x2E86C1, 0xF4F4F4, 0xF1C40F, 0x27AE60, 0x7D3C98, 0x95A5A6];
  var SIGS = [250, 550, 850, 1150, 1450, 1750];
  var PUMPS = [780, 1560];
  var SPD_LBL = ['0', '40', '80', '120', '160'];

  /* ---------------- helpers: 32-bit multiply, seeded LCG, colours ---------------- */
  function mul(a, b) {
    var ah = (a >>> 16) & 0xffff, al = a & 0xffff, bh = (b >>> 16) & 0xffff, bl = b & 0xffff;
    return ((al * bl) + (((ah * bl + al * bh) << 16) >>> 0)) | 0;
  }
  function Rng(seed) { this.s = (seed * 2654435761) >>> 0; }
  Rng.prototype.next = function () { this.s = (mul(this.s, 1664525) + 1013904223) >>> 0; this.s = (mul(this.s, 1664525) + 1013904223) >>> 0; return this.s / 4294967296; };
  Rng.prototype.int = function (n) { return Math.floor(this.next() * n); };
  Rng.prototype.bool = function () { return this.next() < 0.5; };

  function hash(n) {
    n = (n ^ 61) ^ (n >>> 16);
    n = (n + (n << 3)) | 0;
    n ^= n >>> 4;
    n = mul(n, 0x27d4eb2d);
    n ^= n >>> 15;
    return n | 0;
  }
  var colCache = {};
  function C(c) {
    var s = colCache[c];
    if (!s) { s = 'rgb(' + ((c >> 16) & 255) + ',' + ((c >> 8) & 255) + ',' + (c & 255) + ')'; colCache[c] = s; }
    return s;
  }
  function shade(c, f) {
    return (Math.floor(((c >> 16) & 255) * f) << 16) | (Math.floor(((c >> 8) & 255) * f) << 8) | Math.floor((c & 255) * f);
  }

  /* ---------------- track ---------------- */
  var CURVE = [], FEAT = [], i0, k0;
  for (i0 = 0; i0 < T; i0++) { CURVE.push(0); FEAT.push(0); }
  (function () {
    var r = new Rng(11), i = 120, k, len, mag;
    while (i < T - 200) {
      i += 60 + r.int(100);
      len = 80 + r.int(100);
      mag = (1.3 + r.next() * 2.2) * (r.bool() ? 1 : -1);
      for (k = 0; k < len && i < T - 120; k++, i++) CURVE[i] = mag * Math.sin(Math.PI * k / len);
    }
    for (k = 0; k < SIGS.length; k++) FEAT[SIGS[k]] = k + 1;
    for (k = 0; k < PUMPS.length; k++) { FEAT[PUMPS[k]] = 10; FEAT[PUMPS[k] + 4] = 10; FEAT[PUMPS[k] + 8] = 10; }
  })();

  /* ---------------- state ---------------- */
  var state = S_MENU, sel = 0, test = true, low = TV.store.get('drive_low', true) !== false;
  var snd = TV.store.get('drive_snd', true) !== false, best = TV.store.get('drive_best', 0);
  TV.setMuted(!snd);
  var pos = 0, speed = 25, playerX = 0, steer = 0, fuel = 1, score = 100, time = 0, clock = 0, traveled = 0;
  var gear = G_D, gas = false, brk = false, left = false, right = false, blinkL = false, blinkR = false, haz = false;
  var blinkT = 0, overT = 0, offT = 0, crashCd = 0, msgT = 0, lastLane = 1, lastZone = -1;
  var msg = '', hint = '', msgBad = false, resTitle = '', resPass = false, newBest = false;
  var nc = 0, cz = [], cs = [], ct = [], cl = [], cc = [], cn = [], nextC = [], cb = [];
  var X = [], W = [], Y = [], SC = [], head = [], i1;
  for (i1 = 0; i1 < MAXD + 2; i1++) { X.push(0); W.push(0); Y.push(0); SC.push(0); head.push(-1); }
  for (i1 = 0; i1 < NC; i1++) { cz.push(0); cs.push(0); ct.push(0); cl.push(0); cc.push(0); cn.push(0); nextC.push(-1); cb.push(false); }
  var vs = h * 0.5, hor = h * 0.42;
  var rpm = 0.7, lastBlink = -1, audioOn = false;

  var skyG = ctx.createLinearGradient(0, 0, 0, hor);
  skyG.addColorStop(0, '#4F86C6'); skyG.addColorStop(1, '#DCE6EE');
  var hazeG = ctx.createLinearGradient(0, hor, 0, hor + h * 0.14);
  hazeG.addColorStop(0, 'rgba(220,230,238,0.9)'); hazeG.addColorStop(1, 'rgba(220,230,238,0)');

  /* ---------------- sound ---------------- */
  var eng = null;
  function engine(on, rate, vol) {
    try {
      if (!on || !audioOn || TV.isMuted()) {
        if (eng) { try { eng.o.stop(0); } catch (e1) { /* ignore */ } try { eng.o.disconnect(); eng.f.disconnect(); eng.g.disconnect(); } catch (e2) { /* ignore */ } eng = null; }
        return;
      }
      if (!eng) {
        var ac = TV.ac(); if (!ac) return;
        if (ac.state === 'suspended' && ac.resume) ac.resume();
        var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
        o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 420; g.gain.value = 0;
        o.connect(f); f.connect(g); g.connect(ac.destination); o.start(0);
        eng = { o: o, f: f, g: g };
      }
      eng.o.frequency.value = 55 * rate;
      eng.g.gain.value = vol * 0.22;
    } catch (e) { /* silent */ }
  }
  function later(fn, ms) { setTimeout(function () { try { fn(); } catch (e) { /* ignore */ } }, ms); }
  var TICK = 0, TOCK = 1, CRASH = 2, BEEP = 3, GEAR = 4, HORN = 5, WIN = 6, FAIL = 7, CLICK = 8;
  function sfx(id) {
    if (!audioOn || TV.isMuted()) return;
    switch (id) {
      case TICK: TV.beep(2400, 0.03, 'square', 0.03); break;
      case TOCK: TV.beep(1700, 0.03, 'square', 0.03); break;
      case CLICK: TV.beep(1300, 0.03, 'square', 0.04); break;
      case GEAR: TV.beep(95, 0.14, 'triangle', 0.2); break;
      case CRASH: TV.beep(160, 0.5, 'sawtooth', 0.2, 40); TV.beep(900, 0.2, 'square', 0.05, 100); break;
      case BEEP: TV.beep(700, 0.14, 'square', 0.07); later(function () { TV.beep(450, 0.22, 'square', 0.07); }, 170); break;
      case HORN: TV.beep(420, 0.5, 'sawtooth', 0.07); TV.beep(530, 0.5, 'sawtooth', 0.07); break;
      case WIN: TV.beep(523, 0.2, 'triangle', 0.15); later(function () { TV.beep(659, 0.2, 'triangle', 0.15); }, 140); later(function () { TV.beep(784, 0.2, 'triangle', 0.15); }, 280); later(function () { TV.beep(1047, 0.4, 'triangle', 0.15); }, 420); break;
      default: TV.beep(392, 0.3, 'triangle', 0.15); later(function () { TV.beep(330, 0.3, 'triangle', 0.15); }, 200); later(function () { TV.beep(262, 0.45, 'triangle', 0.15); }, 400); break;
    }
  }
  function audio(dt) {
    if (state !== S_PLAY || fuel <= 0) { engine(false, 1, 0); rpm = 0.7; lastBlink = -1; return; }
    var sp = Math.min(1, Math.abs(speed) / MAXK);
    var target = 0.7 + 2.2 * sp;
    if (gas) target = (gear === G_P || gear === G_N) ? 2.3 : target + 0.25;
    rpm += (target - rpm) * Math.min(1, dt * 4);
    engine(true, rpm, 0.22 + (gas ? 0.28 : 0) + 0.2 * sp);
    if (blinkL || blinkR || haz) {
      var ph = Math.floor(clock * 2.5) & 1;
      if (ph !== lastBlink) { lastBlink = ph; sfx(ph === 0 ? TICK : TOCK); }
    } else lastBlink = -1;
  }

  /* ---------------- game flow ---------------- */
  function clearInput() { gas = brk = left = right = false; }
  function pauseGame() { if (state === S_PLAY) { state = S_PAUSE; sel = 0; clearInput(); engine(false, 1, 0); } }
  function resume() { state = S_PLAY; }
  function backToMenu() {
    state = S_MENU; sel = 0; speed = 25; playerX = 0; gear = G_D; steer = 0; clearInput();
    blinkL = blinkR = haz = false; engine(false, 1, 0);
  }
  function startGame(t) {
    test = t; state = S_PLAY; pos = 0; speed = 0; playerX = 0; steer = 0; gear = G_P; fuel = 1; score = 100;
    time = 0; traveled = 0; msg = ''; msgT = 0; hint = ''; blinkL = blinkR = haz = false;
    overT = offT = crashCd = blinkT = 0; lastLane = 1; lastZone = -1; newBest = false;
    clearInput(); spawnTraffic();
  }
  function finish(title, pass) {
    state = S_RESULT; sel = 0; resTitle = title; resPass = pass; newBest = false;
    if (test && score > best) { best = Math.floor(score); newBest = true; TV.store.set('drive_best', best); }
    sfx(pass ? WIN : FAIL); clearInput(); engine(false, 1, 0);
  }
  function tip(m, bad, secs) { msg = m; msgBad = bad; msgT = secs; }
  function pen(m, pts, crash) {
    sfx(crash ? CRASH : BEEP);
    score -= pts; tip(m, true, 2.6);
    if (test && score <= 0) { score = 0; finish('TEST FAILED', false); }
  }
  function shiftGear() {
    if (Math.abs(speed) > 2) { tip('Stop the car before changing gear', true, 2); return; }
    gear = NEXT_GEAR[gear]; sfx(GEAR);
  }
  function items() {
    if (state === S_MENU) return ['Driving Test  (1 lap)', 'Free Drive', low ? 'Graphics: LITE  (smooth on old TVs)' : 'Graphics: BETTER', TV.isMuted() ? 'Sound: OFF' : 'Sound: ON', 'Exit'];
    if (state === S_PAUSE) return ['Resume', 'Restart', 'Main Menu'];
    return ['Play Again', 'Main Menu'];
  }
  function activate() {
    if (state === S_MENU) {
      if (sel === 0) startGame(true);
      else if (sel === 1) startGame(false);
      else if (sel === 2) { low = !low; TV.store.set('drive_low', low); }
      else if (sel === 3) { var m = !TV.isMuted(); TV.setMuted(m); TV.store.set('drive_snd', !m); if (m) engine(false, 1, 0); }
      else TV.exit();
    } else if (state === S_PAUSE) {
      if (sel === 0) resume(); else if (sel === 1) startGame(test); else backToMenu();
    } else if (state === S_RESULT) {
      if (sel === 0) startGame(test); else backToMenu();
    }
  }

  TV.on(function (type, key, rep) {
    var down = type === 'down';
    if (down && !audioOn) { audioOn = true; try { var a = TV.ac(); if (a && a.state === 'suspended' && a.resume) a.resume(); } catch (e) { /* ignore */ } }
    if (state === S_PLAY) {
      switch (key) {
        case 'up': gas = down; break;
        case 'down': brk = down; break;
        case 'left': left = down; break;
        case 'right': right = down; break;
        case 'ok': if (down && !rep) shiftGear(); break;
        case 'k1': if (down && !rep) { blinkL = !blinkL; blinkR = false; haz = false; } break;
        case 'k3': if (down && !rep) { blinkR = !blinkR; blinkL = false; haz = false; } break;
        case 'k2': if (down && !rep) { haz = !haz; blinkL = blinkR = false; } break;
        case 'k4': if (down && !rep) sfx(HORN); break;
        case 'back': case 'start': if (down && !rep) pauseGame(); break;
      }
      return;
    }
    if (!down) return;
    if (key === 'back' || key === 'start') {
      if (rep) return;
      if (state === S_PAUSE) resume();
      else if (state === S_RESULT) backToMenu();
      else if (key === 'back') TV.exit();
      return;
    }
    var it = items();
    if (key === 'up' || key === 'left') { sel = (sel + it.length - 1) % it.length; sfx(CLICK); }
    else if (key === 'down' || key === 'right') { sel = (sel + 1) % it.length; sfx(CLICK); }
    else if (key === 'ok' && !rep) { sfx(CLICK); activate(); }
  });

  /* ---------------- traffic ---------------- */
  function spawnTraffic() {
    var r = new Rng(5), placed = 0, tries = 0, z, lane, d, ok, j, dz;
    while (placed < NC && tries < 3000) {
      tries++;
      z = r.next() * TLEN; lane = r.int(3);
      d = z > TLEN / 2 ? z - TLEN : z;
      if (Math.abs(d) < 9000) continue;
      ok = true;
      for (j = 0; j < placed; j++) {

    ctx.strokeStyle = C(color); ctx.lineWidth = s * 0.28; ctx.lineCap = 'butt';
    if (dir === 0) {
      ctx.beginPath(); ctx.moveTo(cx, cy + s * 0.55); ctx.lineTo(cx, cy - s * 0.15); ctx.stroke();
      tri(cx - s * 0.4, cy - s * 0.15, cx + s * 0.4, cy - s * 0.15, cx, cy - s * 0.75, color);
    } else {
      var vx = cx - dir * s * 0.4;
      ctx.beginPath(); ctx.moveTo(vx, cy + s * 0.55); ctx.lineTo(vx, cy - s * 0.1); ctx.lineTo(cx + dir * s * 0.1, cy - s * 0.1); ctx.stroke();
      tri(cx + dir * s * 0.05, cy - s * 0.1 - s * 0.4, cx + dir * s * 0.05, cy - s * 0.1 + s * 0.4, cx + dir * s * 0.6, cy - s * 0.1, color);
    }
  }
  function drawHud() {
    txt(fmt(time), w * 0.05, h * 0.085, h * 0.075, 0xFFFFFF, 'left', true);
    if (test) txt('Score ' + Math.floor(score) + '   Lap ' + Math.floor(100 * Math.min(1, traveled / TLEN)) + '%', w * 0.05, h * 0.15, h * 0.045, score < 70 ? 0xFF8A80 : 0xB9F6CA, 'left', true);
    var ps = Math.min(T - 1, Math.floor(pos / SEG)), dir = 0, dist = 0, s;
    for (s = 0; s < 130; s++) {
      var cu = CURVE[(ps + s) % T];
      if (Math.abs(cu) > 0.8) { dir = cu > 0 ? 1 : -1; dist = s * MPS; break; }
    }
    arrow(w * 0.5, h * 0.17, h * 0.10, dir, dir === 0 ? 0x35E65B : 0xFF5A1F);
    var lbl = dir === 0 ? 'Straight' : (dist < 6 ? (dir > 0 ? 'Curve right' : 'Curve left') : (Math.floor(dist / 5) * 5) + ' m');
    txt(lbl, w * 0.5, h * 0.31, h * 0.06, 0xFFFFFF, 'center', true);

    var lim = LIM[Math.min(LIM.length - 1, Math.floor(ps / 300))], over = speed > lim + 4;
    var sx = w * 0.86, sy = h * 0.14, sr = h * 0.065;
    circle(sx, sy, sr, (over && (Math.floor(clock * 3) & 1) === 0) ? 0xFFD0D0 : 0xFFFFFF);
    ring(sx, sy, sr * 0.88, 0xE53935, sr * 0.22);
    ctx.font = 'bold ' + Math.round(sr * 0.8) + 'px Arial, Helvetica, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    fill(0x111111); ctx.fillText(String(lim), sx, sy + sr * 0.28);

    for (s = 0; s < 4; s++) {
      var on = s === gear;
      txt(GEARS[s], w * 0.955, h * 0.10 + s * h * 0.085 + h * 0.02, on ? h * 0.07 : h * 0.05, on ? 0xFFB300 : 'rgba(255,255,255,0.6)', 'center', true);
    }
    var tw;
    if (msgT > 0 && msg.length > 0) {
      tw = h * 0.05 * msg.length * 0.52;
      pill(w * 0.5 - tw * 0.5 - h * 0.03, h * 0.36, w * 0.5 + tw * 0.5 + h * 0.03, h * 0.435, msgBad ? 'rgba(183,28,28,0.8)' : 'rgba(27,94,32,0.8)');
      txt(msg, w * 0.5, h * 0.41 + h * 0.012, h * 0.045, 0xFFFFFF, 'center', true);
    } else if (hint.length > 0) {
      tw = h * 0.04 * hint.length * 0.52;
      pill(w * 0.5 - tw * 0.5 - h * 0.03, h * 0.36, w * 0.5 + tw * 0.5 + h * 0.03, h * 0.43, 'rgba(0,0,0,0.67)');
      txt(hint, w * 0.5, h * 0.405 + h * 0.01, h * 0.04, 0xFFEB3B, 'center', true);
    }
  }

  /* ---------------- menus ---------------- */
  function drawItems(top, l, r) {
    var it = items(), step = h * 0.105, i;
    for (i = 0; i < it.length; i++) {
      var y = top + i * step;
      if (i === sel) pill(w * l, y - h * 0.07, w * r, y + h * 0.025, 0xFF9800);
      txt(it[i], w * 0.5, y, h * 0.052, i === sel ? 0x000000 : 0xFFFFFF, 'center', true);
    }
  }
  function drawMenu(title) {
    fill('rgba(0,0,0,0.67)'); rect(0, 0, w, h);
    txt(title, w * 0.5, h * 0.2, h * 0.09, 0xFFFFFF, 'center', true);
    drawItems(h * 0.36, 0.25, 0.75);
    if (state === S_MENU) {
      var s = h * 0.034;
      if (best > 0) txt('Best test score: ' + best, w * 0.5, h * 0.27, h * 0.04, 0xFFD54F, 'center', true);
      txt('UP = accelerator (hold)     DOWN = brake (hold)     LEFT / RIGHT = steering', w * 0.5, h * 0.855, s, 0xDDDDDD, 'center', false);
      txt('OK = change gear when stopped (P > D > R > N)     BACK = pause', w * 0.5, h * 0.905, s, 0xDDDDDD, 'center', false);
      txt('1/RED = left     3/GREEN = right     2/YELLOW = hazard     4/BLUE = horn', w * 0.5, h * 0.955, s, 0xDDDDDD, 'center', false);
    }
  }
  function drawResult() {
    fill('rgba(0,0,0,0.8)'); rect(0, 0, w, h);
    txt(resTitle, w * 0.5, h * 0.2, h * 0.10, resPass ? 0x69F0AE : 0xFF8A80, 'center', true);
    if (test) {
      txt('Score ' + Math.floor(score) + ' / 100     Time ' + fmt(time), w * 0.5, h * 0.30, h * 0.05, 0xFFFFFF, 'center', true);
      txt(resPass ? 'You may be given a licence! (need 70+)' : 'You need 70+ points to pass. Try again!', w * 0.5, h * 0.36, h * 0.04, 0xDDDDDD, 'center', false);
      txt((newBest ? 'New best score! ' : 'Best score: ') + best, w * 0.5, h * 0.42, h * 0.04, 0xFFD54F, 'center', true);
    } else txt('Time ' + fmt(time), w * 0.5, h * 0.30, h * 0.05, 0xFFFFFF, 'center', true);
    drawItems(h * 0.58, 0.3, 0.7);
  }

  function draw() {
    drawScene();
    if (state !== S_MENU) { drawCockpit(); drawHud(); }
    if (state === S_MENU) drawMenu('LITE DRIVING SCHOOL');
    else if (state === S_PAUSE) drawMenu('PAUSED');
    else if (state === S_RESULT) drawResult();
  }

  spawnTraffic();
  TV.loop(update, draw);
})();
</script>
