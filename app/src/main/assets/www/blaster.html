<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Star Blaster</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {

    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';

  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>

<script>

  function newGame() { ship = { x: W / 2, y: H - 70, vx: 0, vy: 0 }; shots = []; foes = []; bits = []; score = 0; lives = 3; wave = 1; t = 0; spawnT = 1; fireT = 0; inv = 1.5; state = 'play'; banner('WAVE 1'); }
  function banner(s) { msg = s; msgT = 1.6; }
  function boom(x, y, col, n) { for (var i = 0; i < n; i++) { var a = Math.random() * 6.3, s = TV.rnd(40, 240); bits.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: TV.rnd(0.3, 0.8), col: col }); } }

  TV.on(function (type, key, rep) {
    if (type !== 'down' || rep) return;
    if (key === 'back') { if (state === 'play') state = 'pause'; else TV.exit(); return; }
    if (state === 'title' || state === 'over') { if (key === 'ok' || key === 'start') newGame(); return; }
    if (state === 'pause') { if (key === 'ok' || key === 'start') state = 'play'; return; }
    if (key === 'start') state = 'pause';
  });

  function spawn() {
    var kind = Math.random() < 0.25 + wave * 0.03 ? 1 : 0, x = TV.rnd(60, W - 60);
    foes.push({ x: x, x0: x, y: -30, kind: kind, hp: kind ? 3 : 1, ph: Math.random() * 6, spd: 70 + wave * 9 + (kind ? 0 : 25), t: 0, shoot: TV.rnd(1, 3) });
  }
  var foeShots = [];
  function update(dt) {
    gridT += dt * 28;
    for (var s = 0; s < stars.length; s++) { stars[s].y += stars[s].s * dt; if (stars[s].y > H) { stars[s].y = 0; stars[s].x = Math.random() * W; } }
    for (var b = bits.length - 1; b >= 0; b--) { var p = bits[b]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) bits.splice(b, 1); }
    if (state !== 'play') return;
    t += dt; if (msgT > 0) msgT -= dt; if (inv > 0) inv -= dt;
    var dx = (TV.held.right ? 1 : 0) - (TV.held.left ? 1 : 0), dy = (TV.held.down ? 1 : 0) - (TV.held.up ? 1 : 0);
    ship.vx += (dx * 360 - ship.vx) * Math.min(1, 12 * dt); ship.vy += (dy * 300 - ship.vy) * Math.min(1, 12 * dt);
    ship.x = TV.clamp(ship.x + ship.vx * dt, 24, W - 24); ship.y = TV.clamp(ship.y + ship.vy * dt, H * 0.45, H - 36);
    fireT -= dt;
    if (TV.held.ok && fireT <= 0) { fireT = 0.17; shots.push({ x: ship.x - 10, y: ship.y - 18 }, { x: ship.x + 10, y: ship.y - 18 }); TV.beep(880, 0.05, 'square', 0.04, 440); }
    for (var i = shots.length - 1; i >= 0; i--) { shots[i].y -= 620 * dt; if (shots[i].y < -20) shots.splice(i, 1); }
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.35, 1.2 - wave * 0.07); }
    for (i = foes.length - 1; i >= 0; i--) {
      var f = foes[i]; f.t += dt; f.y += f.spd * dt; f.x = f.x0 + Math.sin(f.t * 2 + f.ph) * (f.kind ? 70 : 40);
      if (f.kind) { f.shoot -= dt; if (f.shoot <= 0) { f.shoot = 1.6; var ax = ship.x - f.x, ay = ship.y - f.y, l = Math.sqrt(ax * ax + ay * ay) || 1; foeShots.push({ x: f.x, y: f.y, vx: ax / l * 200, vy: ay / l * 200 }); } }
      var hit = false;
      for (var j = shots.length - 1; j >= 0; j--) {
        if (Math.abs(shots[j].x - f.x) < 22 && Math.abs(shots[j].y - f.y) < 20) { shots.splice(j, 1); f.hp--; hit = true; if (f.hp <= 0) break; }
      }
      if (hit && f.hp <= 0) { score += f.kind ? 50 : 20; boom(f.x, f.y, f.kind ? '#ff7a45' : '#ffd21f', 14); TV.beep(200, 0.15, 'sawtooth', 0.08, 60); foes.splice(i, 1); continue; }
      if (inv <= 0 && Math.abs(f.x - ship.x) < 26 && Math.abs(f.y - ship.y) < 24) { foes.splice(i, 1); hurt(); continue; }
      if (f.y > H + 30) foes.splice(i, 1);
    }
    for (i = foeShots.length - 1; i >= 0; i--) {
      var q = foeShots[i]; q.x += q.vx * dt; q.y += q.vy * dt;
      if (inv <= 0 && Math.abs(q.x - ship.x) < 16 && Math.abs(q.y - ship.y) < 18) { foeShots.splice(i, 1); hurt(); continue; }
      if (q.y > H + 20 || q.y < -20 || q.x < -20 || q.x > W + 20) foeShots.splice(i, 1);
    }
    var nw = 1 + Math.floor(score / 400);
    if (nw > wave) { wave = nw; banner('WAVE ' + wave); TV.beep(700, 0.3, 'square', 0.1, 1200); }
  }
  function hurt() {
    lives--; inv = 2; boom(ship.x, ship.y, '#44b8ff', 22); TV.beep(120, 0.4, 'sawtooth', 0.16, 40);
    if (lives <= 0) { state = 'over'; foeShots = []; if (score > best) { best = score; TV.store.set('blaster_best', best); } }
  }
  var KX = 0.04, KZ = 0.07, gridT = 0;
  function X(x) { return (x - W / 2) * KX; }
  function Z(y) { return (y - H) * KZ; }
  function ship3(G, x, z, tilt, blink) {
    if (blink) return;
    G.pyramid(x, 0.9, z - 0.4, 1.5, 2.6, 3.0, '#44b8ff', 0, 0);            // fuselage (points up, so lay it as a wedge)
    G.box(x, 0.8, z + 0.3, 1.0, 0.5, 2.4, '#f3efe4');
    G.box(x - 1.6, 0.6, z + 0.6, 1.8, 0.2, 1.6, '#2b7fd0'); G.box(x + 1.6, 0.6, z + 0.6, 1.8, 0.2, 1.6, '#2b7fd0');
    G.box(x, 0.7, z + 1.9, 0.5, 0.5, 0.9 + Math.random() * 0.6, '#ffb02e', 1);
  }
  function drawShip2(x, y) {
    c.fillStyle = '#44b8ff'; c.beginPath(); c.moveTo(x, y - 24); c.lineTo(x + 20, y + 16); c.lineTo(x, y + 8); c.lineTo(x - 20, y + 16); c.closePath(); c.fill();
    c.fillStyle = '#f3efe4'; c.beginPath(); c.moveTo(x, y - 12); c.lineTo(x + 6, y + 4); c.lineTo(x - 6, y + 4); c.closePath(); c.fill();
    c.fillStyle = '#ffb02e'; c.fillRect(x - 4, y + 9, 8, 6 + Math.random() * 8);
  }
  function draw2() {
    c.fillStyle = '#070b24'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#fff'; for (var i = 0; i < stars.length; i++) c.fillRect(stars[i].x, stars[i].y, stars[i].r, stars[i].r + stars[i].s / 60);
    for (i = 0; i < foes.length; i++) {
      var f = foes[i];
      c.fillStyle = f.kind ? '#ff7a45' : '#a96bff'; c.beginPath(); c.moveTo(f.x - 22, f.y - 12); c.lineTo(f.x + 22, f.y - 12); c.lineTo(f.x, f.y + 18); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.fillRect(f.x - 9, f.y - 7, 5, 5); c.fillRect(f.x + 4, f.y - 7, 5, 5);
    }
    c.fillStyle = '#ffd21f'; if (shots) for (i = 0; i < shots.length; i++) c.fillRect(shots[i].x - 2, shots[i].y - 8, 4, 14);
    c.fillStyle = '#ff5a4e'; for (i = 0; i < foeShots.length; i++) { c.beginPath(); c.arc(foeShots[i].x, foeShots[i].y, 5, 0, 6.3); c.fill(); }
    if (ship && state !== 'over' && (inv <= 0 || Math.floor(inv * 12) % 2 === 0)) drawShip2(ship.x, ship.y);
    for (i = 0; i < bits.length; i++) { c.globalAlpha = Math.max(0, bits[i].life); c.fillStyle = bits[i].col; c.fillRect(bits[i].x, bits[i].y, 4, 4); } c.globalAlpha = 1;
    TV.text('SCORE ' + (score || 0), 16, 20, 22, '#fff', 'left');
    var h = ''; for (i = 0; i < (lives || 0); i++) h += '♥ ';
    TV.text(h, W - 16, 20, 24, '#ff5a4e', 'right');
    if (msgT > 0 && state === 'play') TV.text(msg, W / 2, H * 0.3, 56, '#ffd21f');
    if (state === 'title') TV.panel('STAR BLASTER', ['Press OK to start', 'Arrows move, hold OK to fire', 'Best ' + best], '#44b8ff');
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to play again', 'Back: menu'], '#ff5a4e');
  }
  var draw = TV.pick(draw2, draw3);
  function draw3() {
    var G = TV3D, i, sx = ship ? ship.x : W / 2, sz = ship ? Z(ship.y) : 0, cxw = X(sx) * 0.6;
    G.sky('#04061a', '#1a2a66', H * 0.55);
    c.fillStyle = '#fff'; for (i = 0; i < stars.length; i++) if (stars[i].y < H * 0.5) c.fillRect(stars[i].x, stars[i].y * 0.6, stars[i].r, stars[i].r);
    G.camera([cxw, 10, sz + 15], [cxw, 0, sz - 24], 55); G.fog('#1a2a66', 40, 95); G.light(0.5);
    // scrolling floor grid
    var off = gridT % 6, k;
    G.ground(cxw, sz - 40, 60, 60, '#0b1236');
    for (k = -12; k <= 12; k++) G.quad([k * 5 - 0.06, 0.02, sz + 20], [k * 5 + 0.06, 0.02, sz + 20], [k * 5 + 0.06, 0.02, sz - 90], [k * 5 - 0.06, 0.02, sz - 90], '#2a3d99');
    for (k = 0; k < 20; k++) { var zz = sz + 14 - k * 6 + off; G.quad([-70, 0.02, zz + 0.06], [70, 0.02, zz + 0.06], [70, 0.02, zz - 0.06], [-70, 0.02, zz - 0.06], '#2a3d99'); }
    for (i = 0; i < foes.length; i++) {
      var f = foes[i], fx = X(f.x), fz = Z(f.y);
      G.shadow(fx, fz, 2.4, 2.4);
      if (f.kind) { G.prismY(fx, 1.6, fz, 3.0, 1.1, 3.0, '#ff7a45'); G.pyramid(fx, 2.6, fz, 2.0, 1.4, 2.0, '#ffb26b'); G.box(fx, 1.7, fz + 1.5, 0.6, 0.6, 0.2, '#fff', 1); }
      else { G.pyramid(fx, 1.5, fz, 2.4, 2.6, 2.4, '#a96bff', 0, f.t * 3); G.box(fx - 0.4, 1.6, fz + 0.9, 0.3, 0.3, 0.2, '#fff', 1); G.box(fx + 0.4, 1.6, fz + 0.9, 0.3, 0.3, 0.2, '#fff', 1); }
    }
    for (i = 0; i < shots.length; i++) G.box(X(shots[i].x), 1, Z(shots[i].y), 0.22, 0.22, 1.4, '#ffd21f', 1);
    for (i = 0; i < foeShots.length; i++) G.prismY(X(foeShots[i].x), 1.1, Z(foeShots[i].y), 0.7, 0.7, 0.7, '#ff5a4e', 1);
    for (i = 0; i < bits.length; i++) G.box(X(bits[i].x), 1 + (1 - bits[i].life) * 1.5, Z(bits[i].y), 0.3, 0.3, 0.3, bits[i].col, 1);
    if (ship && state !== 'over') { G.shadow(X(ship.x), sz, 3.4, 3.4); ship3(G, X(ship.x), sz, 0, inv > 0 && Math.floor(inv * 12) % 2 !== 0); }
    G.flush();
    TV.text('SCORE ' + (score || 0), 16, 20, 22, '#fff', 'left');
    var h = ''; for (i = 0; i < (lives || 0); i++) h += '\u2665 ';
    TV.text(h, W - 16, 20, 24, '#ff5a4e', 'right');
    if (msgT > 0 && state === 'play') TV.text(msg, W / 2, H * 0.3, 56, '#ffd21f');
    if (state === 'title') TV.panel('STAR BLASTER 3D', ['Press OK to start', 'Arrows move, hold OK to fire', 'Best ' + best], '#44b8ff');
    else if (state === 'pause') TV.panel('PAUSED', ['OK: resume'], '#ffd21f');
    else if (state === 'over') TV.panel('GAME OVER', ['Score ' + score + '   Best ' + best, 'Press OK to play again', 'Back: menu'], '#ff5a4e');
  }
  TV.loop(update, draw);
})();
</script>
