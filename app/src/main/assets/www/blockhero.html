<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Block Hero</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif;touch-action:none}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#7EC8FF;max-width:100%;max-height:100%}
  #hud{position:absolute;left:0;right:0;top:0;color:#fff;text-shadow:0 1px 3px #000;font-weight:bold;
       display:flex;justify-content:center;pointer-events:none}
  #top{padding:6px 10px;font-size:15px;white-space:nowrap}
  #mid{position:absolute;left:0;right:0;top:38%;text-align:center;color:#fff;text-shadow:0 2px 6px #000;
       white-space:pre-line;font-weight:bold;font-size:18px;pointer-events:none;padding:0 16px}
  #mid b{font-size:30px;display:block;margin-bottom:8px;letter-spacing:2px}
  #pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
       padding:14px;box-sizing:border-box;pointer-events:none}
  .btn{pointer-events:auto;user-select:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);
       border:2px solid rgba(255,255,255,.5);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;
       -webkit-tap-highlight-color:transparent}
  .btn:active{background:rgba(255,255,255,.45)}
  #left{display:flex;gap:10px}
  #mute{position:absolute;right:10px;top:8px;pointer-events:auto;color:#fff;background:rgba(0,0,0,.3);border:none;
        border-radius:6px;padding:6px 10px;font-size:16px}
</style></head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="hud"><div id="top"></div></div>
  <div id="mid"></div>
  <button id="mute">🔊</button><button id="vw" style="position:absolute;right:62px;top:8px;pointer-events:auto;color:#fff;background:rgba(0,0,0,.3);border:none;border-radius:6px;padding:6px 10px;font-size:16px">2D/3D</button>
  <div id="pad">
    <div id="left">
      <div class="btn" id="bStop">◀</div>
      <div class="btn" id="bSprint">▶▶</div>
    </div>
    <div class="btn" id="bJump">⤒</div>
  </div>
</div>
<script>var TV = { ctx: document.getElementById('c').getContext('2d'), W: 960, H: 540 };</script>
<script>
var TV3D = (function () {
  var T = {}, ctx = TV.ctx, W = TV.W, H = TV.H, faces = [], cam = null, light = [-0.35, 0.8, 0.45], amb = 0.5, fogCol = [150, 180, 220], fogS = 80, fogE = 400;
  var colCache = {};
  function parse(c) {
    if (typeof c !== 'string') return c;
    if (colCache[c]) return colCache[c];
    var v = [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)];
    colCache[c] = v; return v;
  }
  T.parse = parse;
  (function () { var m = Math.sqrt(light[0] * light[0] + light[1] * light[1] + light[2] * light[2]); light = [light[0] / m, light[1] / m, light[2] / m]; })();
  function norm3(v) { var m = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]) || 1; return [v[0] / m, v[1] / m, v[2] / m]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }

  /* ---- unit shapes: arrays of faces; each face = array of [x,y,z], wound so the outside is counter-clockwise ---- */
  function fixWinding(shape) {
    for (var i = 0; i < shape.length; i++) {
      var f = shape[i], a = f[0], b = f[1], c = f[2];
      var n = cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]);
      var cx = 0, cy = 0, cz = 0, k;
      for (k = 0; k < f.length; k++) { cx += f[k][0]; cy += f[k][1]; cz += f[k][2]; }
      cx /= f.length; cy = cy / f.length - 0.05; cz /= f.length;     // shapes are centred on the origin
      if (n[0] * cx + n[1] * cy + n[2] * cz < 0) f.reverse();
    }
    return shape;
  }
  var h = 0.5;
  var CUBE = fixWinding([
    [[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]], [[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]],
    [[h, -h, h], [h, -h, -h], [h, h, -h], [h, h, h]], [[-h, -h, -h], [-h, -h, h], [-h, h, h], [-h, h, -h]],
    [[-h, h, h], [h, h, h], [h, h, -h], [-h, h, -h]], [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]]]);
  var PYR = fixWinding([
    [[-h, -h, -h], [h, -h, -h], [0, h, 0]], [[h, -h, -h], [h, -h, h], [0, h, 0]], [[h, -h, h], [-h, -h, h], [0, h, 0]], [[-h, -h, h], [-h, -h, -h], [0, h, 0]],
    [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]]]);
  function prism(axis, sides) {
    var out = [], ring = [], i;
    for (i = 0; i < sides; i++) { var a = Math.PI * 2 * i / sides; ring.push([Math.cos(a) * h, Math.sin(a) * h]); }
    function pt(p, along) { return axis === 0 ? [along, p[0], p[1]] : axis === 1 ? [p[0], along, p[1]] : [p[0], p[1], along]; }
    for (i = 0; i < sides; i++) { var p0 = ring[i], p1 = ring[(i + 1) % sides]; out.push([pt(p0, -h), pt(p1, -h), pt(p1, h), pt(p0, h)]); }
    var c0 = [], c1 = []; for (i = 0; i < sides; i++) { c0.push(pt(ring[i], -h)); c1.push(pt(ring[i], h)); }
    out.push(c0, c1); return fixWinding(out);
  }
  T.CUBE = CUBE; T.PYR = PYR; T.PX = prism(0, 8); T.PY = prism(1, 8); T.PZ = prism(2, 8);

  /* ---- camera ---- */
  T.camera = function (pos, target, fovDeg) {
    var f = norm3([target[0] - pos[0], target[1] - pos[1], target[2] - pos[2]]);
    var r = norm3(cross(f, [0, 1, 0])), u = cross(r, f);
    cam = { p: pos, f: f, r: r, u: u, focal: (H / 2) / Math.tan(fovDeg * Math.PI / 360) };
  };
  T.target = function (g) { ctx = g || TV.ctx; };      // draw into another canvas context (null = the screen)
  T.fog = function (col, s, e) { fogCol = parse(col); fogS = s; fogE = e; };
  T.light = function (ambient) { amb = ambient; };
  T.view = function (p) {       // world -> [x, y, depth] in camera space (before projection)
    var vx = p[0] - cam.p[0], vy = p[1] - cam.p[1], vz = p[2] - cam.p[2];
    return [vx * cam.r[0] + vy * cam.r[1] + vz * cam.r[2], vx * cam.u[0] + vy * cam.u[1] + vz * cam.u[2], vx * cam.f[0] + vy * cam.f[1] + vz * cam.f[2]];
  };
  /* world point -> screen [x, y, depth], or null when behind the camera */
  T.project = function (p) {
    var v = T.view(p); if (v[2] < 0.5) return null;
    var k = cam.focal / v[2]; return [W / 2 + v[0] * k, H / 2 - v[1] * k, v[2]];
  };
  T.scale = function (z) { return cam.focal / z; };

  function clipNear(pts) {           // Sutherland-Hodgman against z = near in view space
    var out = [], n = pts.length, i, near = 0.6;
    for (i = 0; i < n; i++) {
      var a = pts[i], b = pts[(i + 1) % n], ina = a[2] >= near, inb = b[2] >= near;
      if (ina) out.push(a);
      if (ina !== inb) { var t = (near - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, near]); }
    }
    return out;
  }
  function paint(g, pts, css) {      // pts in view space
    var q = clipNear(pts); if (q.length < 3) return;
    g.beginPath();
    for (var i = 0; i < q.length; i++) {
      var k = cam.focal / q[i][2], x = W / 2 + q[i][0] * k, y = H / 2 - q[i][1] * k;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath(); g.fillStyle = css; g.fill(); g.lineWidth = 0.7; g.strokeStyle = css; g.stroke();
  }
  function fogMix(col, d) {
    var f = (d - fogS) / (fogE - fogS); f = f < 0 ? 0 : f > 1 ? 1 : f;
    return 'rgb(' + Math.round(col[0] + (fogCol[0] - col[0]) * f) + ',' + Math.round(col[1] + (fogCol[1] - col[1]) * f) + ',' + Math.round(col[2] + (fogCol[2] - col[2]) * f) + ')';
  }

  /* ---- drawing a shape: queue its visible faces, flush() sorts and paints them ---- */
  T.shape = function (shape, x, y, z, sx, sy, sz, color, emit, yaw) {
    var col = parse(color), cs = 1, sn = 0, i, k;
    if (yaw) { cs = Math.cos(yaw); sn = Math.sin(yaw); }
    for (i = 0; i < shape.length; i++) {
      var f = shape[i], vs = [], vw = [];
      for (k = 0; k < f.length; k++) {
        var px = f[k][0] * sx, py = f[k][1] * sy, pz = f[k][2] * sz;
        var wx = x + px * cs + pz * sn, wz = z - px * sn + pz * cs, wy = y + py;
        vw.push([wx, wy, wz]);
      }
      var a = vw[0], b = vw[1], c = vw[2];
      var n = norm3(cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - a[0], c[1] - a[1], c[2] - a[2]]));
      var ccx = 0, ccy = 0, ccz = 0; for (k = 0; k < vw.length; k++) { ccx += vw[k][0]; ccy += vw[k][1]; ccz += vw[k][2]; }
      ccx /= vw.length; ccy /= vw.length; ccz /= vw.length;
      if (n[0] * (cam.p[0] - ccx) + n[1] * (cam.p[1] - ccy) + n[2] * (cam.p[2] - ccz) <= 0) continue;     // back face
      var d = T.view([ccx, ccy, ccz]);
      if (d[2] < 0.6 && d[2] > -200) { /* partly behind: still try, clipping handles it */ }
      for (k = 0; k < vw.length; k++) vs.push(T.view(vw[k]));
      var allBehind = true; for (k = 0; k < vs.length; k++) if (vs[k][2] >= 0.6) allBehind = false;
      if (allBehind) continue;
      var l = amb + (1 - amb) * Math.max(0, n[0] * light[0] + n[1] * light[1] + n[2] * light[2]);
      if (emit) l = l + (1 - l) * emit;
      faces.push({ d: d[2], v: vs, c: [col[0] * l, col[1] * l, col[2] * l] });
    }
  };
  T.box = function (x, y, z, sx, sy, sz, color, emit, yaw) { T.shape(CUBE, x, y, z, sx, sy, sz, color, emit, yaw); };
  T.pyramid = function (x, y, z, sx, sy, sz, color, emit, yaw) { T.shape(PYR, x, y, z, sx, sy, sz, color, emit, yaw); };
  T.prismY = function (x, y, z, sx, sy, sz, color, emit, yaw) { T.shape(T.PY, x, y, z, sx, sy, sz, color, emit, yaw); };
  T.prismX = function (x, y, z, sx, sy, sz, color, emit, yaw) { T.shape(T.PX, x, y, z, sx, sy, sz, color, emit, yaw); };
  T.prismZ = function (x, y, z, sx, sy, sz, color, emit, yaw) { T.shape(T.PZ, x, y, z, sx, sy, sz, color, emit, yaw); };

  T.flush = function () {
    faces.sort(function (a, b) { return b.d - a.d; });
    for (var i = 0; i < faces.length; i++) { var f = faces[i]; paint(ctx, f.v, fogMix(f.c, f.d)); }
    faces.length = 0;
  };
  /* A flat quad on the ground (or any plane) painted immediately, before the sorted shapes. corners in world space. */
  T.quad = function (a, b, c, d, color, g) {
    var col = parse(color); var vs = [T.view(a), T.view(b), T.view(c), T.view(d)];
    var cz = (vs[0][2] + vs[1][2] + vs[2][2] + vs[3][2]) / 4;
    paint(g || ctx, vs, typeof color === 'string' && color.charAt(0) !== '#' ? color : fogMix([col[0], col[1], col[2]], cz));
  };
  T.shadow = function (x, z, sx, sz, y) {
    var yy = y || 0.02, vs = [T.view([x - sx / 2 + 0.3, yy, z - sz / 2 + 0.25]), T.view([x + sx / 2 + 0.3, yy, z - sz / 2 + 0.25]), T.view([x + sx / 2 + 0.3, yy, z + sz / 2 + 0.25]), T.view([x - sx / 2 + 0.3, yy, z + sz / 2 + 0.25])];
    paint(ctx, vs, 'rgba(5,8,25,.35)');
  };
  T.sky = function (top, bottom, horizonY) {
    var g = ctx.createLinearGradient(0, 0, 0, horizonY || H * 0.6); g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* Draw static scenery once into an offscreen canvas and reuse it every frame (the camera must not move). */
  var layer = null, layerKey = '';

    if (!layer || layerKey !== key) {
      layer = document.createElement('canvas'); layer.width = W; layer.height = H; layerKey = key;
      var g = layer.getContext('2d'); fn(g);

  };
  T.uncache = function () { layer = null; layerKey = ''; };
  T.quadTo = function (g, a, b, c, d, color) { T.quad(a, b, c, d, color, g); };
  T.ground = function (cx, cz, hw, hd, color) { T.quad([cx - hw, 0, cz + hd], [cx + hw, 0, cz + hd], [cx + hw, 0, cz - hd], [cx - hw, 0, cz - hd], color); };
  T.cam = function () { return cam; };
  return T;
})();
</script>
<script>
'use strict';
/* ===================================================================== audio (tiny procedural SFX) */
var actx = null, muted = false;
function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function beep(freq, dur, type, vol, slide) {
  if (muted) return;
  var a = ac(); if (!a) return;
  var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
}
var SFX = {
  jump: function () { beep(520, 0.12, 'square', 0.14, 820); },
  coin: function () { beep(880, 0.07, 'square', 0.12); setTimeout(function () { beep(1320, 0.09, 'square', 0.12); }, 60); },
  stomp: function () { beep(180, 0.1, 'square', 0.16, 70); },
  hurt: function () { beep(140, 0.22, 'sawtooth', 0.18, 60); },
  win: function () { [660, 880, 1100, 1320].forEach(function (f, i) { setTimeout(function () { beep(f, 0.18, 'square', 0.15); }, i * 110); }); }
};
document.getElementById('mute').onclick = function () { muted = !muted; this.textContent = muted ? '🔇' : '🔊'; };

/* ===================================================================== level data (ported 1:1 from Level.java) */
function rgb(hex) { return 'rgb(' + ((hex >> 16) & 255) + ',' + ((hex >> 8) & 255) + ',' + (hex & 255) + ')'; }
function shade(hex, k) {
  var r = Math.min(255, Math.round(((hex >> 16) & 255) * k)), g = Math.min(255, Math.round(((hex >> 8) & 255) * k)), b = Math.min(255, Math.round((hex & 255) * k));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
var TREE = 0, BUSH = 1, CLOUD = 2, MOUNTAIN = 3, CACTUS = 4, CRYSTAL = 5, ROCK = 6;

function LevelBuilder() {
  this.boxes = []; this.enemies = []; this.coins = []; this.posts = []; this.decor = [];
  this.z = 0; this.zs = 0; this.lastTop = 0; this.goalY = 0; this.goalZ = 0; this.endZ = 0; this.killY = -14;
}
LevelBuilder.prototype.seg = function (w, len, topY) {
  var b = { z0: this.z, z1: this.z + len, y1: topY, y0: topY - 4, top: this.topCol, side: this.sideCol, axis: -1, amp: 0, spd: 0, ph: 0, prev: 0, dz: 0, dy: 0 };
  this.boxes.push(b); this.zs = this.z; this.z += len; this.lastTop = topY; return b;
};
LevelBuilder.prototype.gap = function (g) { this.z += g; };
LevelBuilder.prototype.mover = function (b, axis, amp, spd, ph) {
  b.axis = axis; b.amp = amp; b.spd = spd; b.ph = ph; b.prev = Math.sin(ph) * amp;
  if (axis === 1) b.y0 += b.prev, b.y1 += b.prev; else b.z0 += b.prev, b.z1 += b.prev;
};
LevelBuilder.prototype.en = function (axis, fixed, min, max, spd) {
  // axis 0 = a sideways (3D x-axis) patroller at fixed z; flatten() turns it into a z-patrol
  // of fixed half-width 1.8 centred on that z, discarding the old x-range entirely.
  // axis 2 = already a z-patroller in 3D; its min/max z-range is kept as given.
  if (axis === 0) { min = fixed - 1.8; max = fixed + 1.8; }
  this.enemies.push({ axis: 2, min: min, max: max, spd: spd, y: this.lastTop, z: min, dir: 1, squash: 0, anim: 0, gone: false });
};
LevelBuilder.prototype.coins_ = function (x0, y0, z0, x1, y1, z1, n) {
  for (var i = 0; i < n; i++) { var t = n === 1 ? 0.5 : i / (n - 1); this.coins.push({ y: y0 + (y1 - y0) * t, z: z0 + (z1 - z0) * t, taken: false }); }
};
LevelBuilder.prototype.arc = function (za, zb, y0, h, n) {
  for (var i = 0; i < n; i++) { var t = i / (n - 1); this.coins.push({ z: za + (zb - za) * t, y: y0 + h * Math.sin(Math.PI * t), taken: false }); }
};
LevelBuilder.prototype.post = function (zz) { this.posts.push({ y: this.lastTop, z: zz, reached: false }); };
LevelBuilder.prototype.goal = function (zz) { this.goalY = this.lastTop; this.goalZ = zz; };

/** Converts a mover that was originally a sideways (3D x-axis) slider into a forward/back slider
 *  with a fixed amplitude of 1.2, exactly like Level.flatten() in the original game (the real
 *  amplitude/axis it had in 3D is discarded; only its speed and phase carry over). */
LevelBuilder.prototype.flattenSideways = function (b, spd, ph) {
  b.axis = 2; b.spd = spd; b.ph = ph; b.amp = 1.2; b.prev = Math.sin(ph) * 1.2;
  b.z0 += b.prev; b.z1 += b.prev;
};

function buildLevel(idx) {
  var L = new LevelBuilder(), sky, topHex, sideHex;
  if (idx === 0) {
    L.name = 'GRASS HILLS'; sky = 0x7EC8FF; topHex = 0x5CC94A; sideHex = 0x8B5A2B; L.bg = 0;
    L.topCol = rgb(topHex); L.sideCol = rgb(sideHex);
    L.z = -6;
    L.seg(10, 22, 0);
    L.en(0, 12, -3, 3, 1.5); L.coins_(0, 1, 3, 0, 1, 11, 5); L.arc(14.5, 20.5, 0.8, 1.8, 6);
    L.gap(3);
    L.seg(10, 15, 0);
    L.en(0, 27, -3, 3, 1.8); L.coins_(0, 1, 22, 0, 1, 32, 5); L.arc(33, 38, 0.8, 1.8, 5);
    L.gap(3);
    L.seg(8, 6, 1); L.coins_(0, 2.2, 38, 0, 2.2, 41, 3);
    L.seg(6, 6, 2); L.coins_(0, 3.2, 44, 0, 3.2, 47, 3);
    L.seg(10, 22, 0); L.post(L.zs + 3);
    L.en(2, 0, L.zs + 6, L.zs + 19, 1.8); L.en(2, 0, L.zs + 4, L.zs + 17, 2.0);
    L.coins_(0, 1, L.zs + 4, 0, 1, L.zs + 18, 6);
    L.gap(3);
    L.seg(5, 5, 0.5); L.coins_(0, 1.7, L.zs + 1.5, 0, 1.7, L.zs + 3.5, 2);
    L.gap(2);
    L.seg(5, 5, 1.0); L.coins_(0, 2.2, L.zs + 1.5, 0, 2.2, L.zs + 3.5, 2);
    L.gap(2);
    L.seg(5, 5, 1.5); L.coins_(0, 2.7, L.zs + 1.5, 0, 2.7, L.zs + 3.5, 2);
    L.gap(2.5);
    L.seg(10, 22, 0); L.post(L.zs + 3);
    L.en(0, L.zs + 8, -3.5, 3.5, 2.0); L.en(0, L.zs + 13, -3.5, 3.5, 2.2); L.en(2, 0, L.zs + 15, L.zs + 20, 1.6);
    L.coins_(0, 1, L.zs + 4, 0, 1, L.zs + 19, 7);
    L.gap(3);
    L.seg(3, 12, 0); L.coins_(0, 1, L.zs + 1, 0, 1, L.zs + 11, 6);
    L.gap(3);
    L.seg(12, 20, 0); L.goal(L.zs + 10);
    L.endZ = L.z;
  } else if (idx === 1) {
    L.name = 'SUNSET DUNES'; sky = 0xFFA060; topHex = 0xEBC873; sideHex = 0xB0693A; L.bg = 1;
    L.topCol = rgb(topHex); L.sideCol = rgb(sideHex);
    L.z = -6;
    L.seg(10, 20, 0); L.en(0, 10, -3, 3, 2.0); L.coins_(0, 1, 2, 0, 1, 9, 5);
    L.gap(3.5);

    G.box(c.z, c.y + 0.7 + Math.sin(time * 3 + c.z) * 0.12, 0, w, 0.7, 0.14, '#FFD21F', 0.5);
  });
  lv.enemies.forEach(function (e) {
    if (e.gone || e.z < zMin || e.z > zMax) return;
    var f = e.squash > 0 ? 0.3 : 1;
    G.box(e.z, e.y + 0.3 * f, 0, 0.95, 0.6 * f, 0.95, '#8B4A2B');
    G.box(e.z, e.y + 0.75 * f, 0, 0.8, 0.4 * f, 0.8, '#B8652F');
    G.box(e.z - 0.2, e.y + 0.45 * f, 0.5, 0.14, 0.14, 0.06, '#151515'); G.box(e.z + 0.2, e.y + 0.45 * f, 0.5, 0.14, 0.14, 0.06, '#151515');
  });
  lv.posts.forEach(function (p) {
    if (p.z < zMin || p.z > zMax) return;
    G.box(p.z, p.y + 1.1, 0, 0.12, 2.2, 0.12, '#ffffff');
    G.box(p.z + 0.5, p.y + 1.8, 0, 0.8, 0.45, 0.06, p.reached ? '#2FD060' : '#D82020', 0.3);
  });
  if (lv.goalZ >= zMin - 4 && lv.goalZ <= zMax + 4) {
    var gz = lv.goalZ, gy = lv.goalY;
    G.box(gz, gy + 0.2, 0, 1.4, 0.4, 1.4, '#A8A8B0');
    G.box(gz, gy + 3, 0, 0.18, 5.6, 0.18, '#ffffff');
    G.box(gz, gy + 5.9, 0, 0.5, 0.5, 0.5, '#FFD21F', 0.4);
    G.box(gz + 0.8 + Math.sin(time * 4) * 0.08, gy + 5.0, 0, 1.5, 0.8, 0.08, '#2FD060', 0.3);
    G.box(gz + 4.5, gy + 2, -0.5, 3.2, 4, 3, '#C9C2B4'); G.box(gz + 4, gy + 1, 1.05, 0.9, 2, 0.1, '#4A2A14');
  }
  var gb = groundBelow();
  if (gb > -999) G.shadow(pz, 0, 0.9, 0.9, gb + 0.02);
  if (!(inv > 0 && (Math.floor(time * 14) & 1) === 0)) {
    var amp = Math.min(1, Math.abs(vz) / 5), sw = Math.sin(walk) * 0.3 * amp, sqs = 1 + sq;
    G.box(pz - 0.15, py + 0.35 * sqs, sw * 0.5, 0.28, 0.7 * sqs, 0.3, '#2A4FD8');
    G.box(pz + 0.15, py + 0.35 * sqs, -sw * 0.5, 0.28, 0.7 * sqs, 0.3, '#2A4FD8');
    G.box(pz, py + 0.95 * sqs, 0, 0.62, 0.55 * sqs, 0.4, '#2A4FD8');
    G.box(pz, py + 1.3 * sqs, 0, 0.7, 0.3 * sqs, 0.44, '#D82020');
    G.box(pz, py + 1.7 * sqs, 0, 0.5, 0.45 * sqs, 0.46, '#F0B98A');
    G.box(pz, py + 2.0 * sqs, 0, 0.58, 0.22 * sqs, 0.5, '#D82020'); G.box(pz + 0.25, py + 1.93 * sqs, 0.1, 0.36, 0.08, 0.5, '#D82020');
  }

}
function render() { if (VIEW === '2d') render2(); else render3(); }

/* ===================================================================== HUD + loop */
var topEl = document.getElementById('top'), midEl = document.getElementById('mid');
function pushHud() {
  var top = '', mid = '';
  if (state !== TITLE) {
    var hearts = ''; for (var i = 0; i < health; i++) hearts += '♥';
    top = hearts + '    LIVES ' + lives + '    COINS ' + coinCount + '    SCORE ' + score + '    ' + (levelIdx + 1) + '/3  ' + lv.name;
  }
  switch (state) {
    case TITLE: mid = '<b>BLOCK HERO</b>Press OK (or tap JUMP) to start\n\nUp/OK jump · Right sprint · Left stop · Back: menu\nThe hero runs right by itself\nStomp mushrooms, grab coins, reach the flag!'; break;
    case PAUSE: mid = '<b>PAUSED</b>Jump: resume   ◀: quit'; break;
    case CLEAR: mid = stateT > 0.6 ? ('<b>LEVEL CLEAR!</b>Score ' + score + '\nTap to continue') : ''; break;
    case OVER: mid = stateT > 0.6 ? ('<b>GAME OVER</b>Score ' + score + '\nTap to go to title') : ''; break;
    case WIN: mid = stateT > 0.6 ? ('<b>YOU WIN!</b>Final score ' + score + '\nTap to go to title') : ''; break;
    default: if (msgT > 0) mid = msg; break;
  }
  topEl.textContent = top; midEl.innerHTML = mid;
}
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  var n = Math.max(1, Math.ceil(dt / 0.017)), h = dt / n;
  for (var i = 0; i < n; i++) step(h);
  if (hudDirty) { hudDirty = false; pushHud(); }
  render();
  requestAnimationFrame(frame);
}
loadTitle(); pushHud(); requestAnimationFrame(frame);

/* ===================================================================== input */
function resize() {
  var r = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * r) + 'px'; canvas.style.height = (H * r) + 'px';
}
window.addEventListener('resize', resize); resize();

function keyName(e) {
  var k = e.key, c = e.keyCode || e.which;
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyZ' || e.code === 'Enter' || k === 'Enter' || k === ' ' || k === 'ArrowUp' || c === 13 || c === 32 || c === 38 || c === 23 || c === 19 || c === 96 || c === 90) return 'act';
  if (e.code === 'ArrowRight' || k === 'ArrowRight' || c === 39 || c === 22) return 'right';
  if (e.code === 'ArrowLeft' || e.code === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowDown' || c === 37 || c === 40 || c === 21 || c === 20) return 'left';
  if (k === 'v' || k === 'V') return 'view';
  if (e.code === 'Escape' || e.code === 'Backspace' || k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97) return 'back';
  return '';
}
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  var k = keyName(e); if (!k) return;
  e.preventDefault();
  if (k === 'view') toggleView(); else if (k === 'act') actPress = true; else if (k === 'right') kRight = true; else if (k === 'left') kLeft = true; else backPress = true;
});
window.addEventListener('keyup', function (e) {
  var k = keyName(e);
  if (k === 'right') kRight = false; else if (k === 'left') kLeft = false;
});
function hold(el, on, off) {
  el.addEventListener('touchstart', function (e) { e.preventDefault(); on(); }, { passive: false });
  el.addEventListener('touchend', function (e) { e.preventDefault(); off(); }, { passive: false });
  el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
}
hold(document.getElementById('bSprint'), function () { kRight = true; }, function () { kRight = false; });
hold(document.getElementById('bStop'), function () { kLeft = true; }, function () { kLeft = false; });
document.getElementById('bJump').addEventListener('touchstart', function (e) { e.preventDefault(); actPress = true; }, { passive: false });
document.getElementById('bJump').addEventListener('mousedown', function () { actPress = true; });
document.getElementById('vw').addEventListener('click', function (e) { e.stopPropagation(); toggleView(); });
canvas.addEventListener('click', function () { actPress = true; ac(); });
document.body.addEventListener('touchstart', function () { ac(); }, { passive: true, once: true });
</script>
