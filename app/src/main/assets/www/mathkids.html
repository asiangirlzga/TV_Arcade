<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Pals</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:relative;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
  canvas{display:block;background:#0b1030}
  #toast{position:absolute;left:0;right:0;bottom:3%;text-align:center;color:#cfd6ff;font-size:18px;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;-webkit-transition:opacity .4s;transition:opacity .4s}
  #pad{position:absolute;left:0;right:0;bottom:0;display:none;padding:12px;box-sizing:border-box;pointer-events:none;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-end;align-items:flex-end}
  .touch #pad{display:-webkit-flex;display:flex}
  .pb{pointer-events:auto;width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.45);color:#fff;font-size:24px;line-height:64px;text-align:center;margin:4px;display:inline-block;-webkit-tap-highlight-color:transparent}
  .pb.on{background:rgba(255,255,255,.5)}
  #exit{position:absolute;right:8px;top:6px;color:#fff;background:rgba(0,0,0,.35);border-radius:6px;padding:6px 10px;font-size:15px;display:none}
  .touch #exit{display:block}
</style></head>
<body><div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="toast"></div>
  <div id="exit">Menu</div>
  <div id="pad"><div><span class="pb" data-k="left">&#9664;</span><span class="pb" data-k="right">&#9654;</span></div>
  <div><span class="pb" data-k="up">&#9650;</span><span class="pb" data-k="down">&#9660;</span><span class="pb" data-k="ok">OK</span><span class="pb" id="vw" data-k="view" style="display:none">2D/3D</span></div></div>
</div>
<script>
'use strict';
/* ---------- TV: input, loop, audio, helpers ---------- */
var TV = (function () {
  var T = {}, cv = document.getElementById('c'), handlers = [], held = {}, actx = null, muted = false;
  T.cv = cv; T.ctx = cv.getContext('2d'); T.W = cv.width; T.H = cv.height; T.held = held; T.hint = "Left\/Right: pick. OK: choose. 1: show help. 2: hear it again. 3: voice on\/off. Back: menu.";

  /* Turn any key (TV remote, keyboard, game pad app) into: left right up down ok back start */
  function norm(e) {
    var k = e.key, c = e.keyCode || e.which;
    if (k === 'ArrowLeft' || c === 37 || c === 21 || k === 'a' || k === 'A') return 'left';
    if (k === 'ArrowRight' || c === 39 || c === 22 || k === 'd' || k === 'D') return 'right';
    if (k === 'ArrowUp' || c === 38 || c === 19 || k === 'w' || k === 'W') return 'up';
    if (k === 'ArrowDown' || c === 40 || c === 20 || k === 's' || k === 'S') return 'down';
    if (k === 'Enter' || c === 13 || c === 23 || k === ' ' || c === 32 || k === 'Select' || c === 96 || k === 'z' || k === 'Z') return 'ok';
    if (k === 'Escape' || c === 27 || c === 8 || c === 4 || c === 461 || c === 10009 || c === 10182 || c === 97 || k === 'GoBack' || k === 'BrowserBack') return 'back';
    if (k === '1' || c === 403 || k === 'q' || k === 'Q') return 'k1';
    if (k === '2' || c === 405) return 'k2';
    if (k === '3' || c === 404 || k === 'e' || k === 'E') return 'k3';
    if (k === '4' || c === 406 || k === 'h' || k === 'H') return 'k4';
    if (k === 'v' || k === 'V') return 'view';
    if (k === 'p' || k === 'P' || c === 80 || c === 108 || c === 415 || c === 179) return 'start';
    return '';
  }
  function fire(type, key, rep) {
    if (type === 'down') { if (!rep) held[key] = true; } else held[key] = false;
    for (var i = 0; i < handlers.length; i++) { try { handlers[i](type, key, !!rep); } catch (err) { if (window.console) console.error(err); } }
  }
  T.on = function (fn) { handlers.push(fn); };
  T.fire = fire;
  window.addEventListener('keydown', function (e) {
    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('down', k, e.repeat);
  }, false);
  window.addEventListener('keyup', function (e) {
    var k = norm(e); if (!k) return;
    e.preventDefault(); fire('up', k, false);
  }, false);

  /* Touch pad for phones and tablets */
  window.addEventListener('touchstart', function () { document.documentElement.className = 'touch'; T.fit(); }, false);
  var btns = document.querySelectorAll('.pb');
  for (var i = 0; i < btns.length; i++) (function (b) {
    var k = b.getAttribute('data-k');
    function on(e) { e.preventDefault(); b.className = 'pb on'; fire('down', k, false); }
    function off(e) { e.preventDefault(); b.className = 'pb'; fire('up', k, false); }
    b.addEventListener('touchstart', on, false); b.addEventListener('touchend', off, false); b.addEventListener('touchcancel', off, false);
    b.addEventListener('mousedown', on, false); b.addEventListener('mouseup', off, false); b.addEventListener('mouseleave', off, false);
  })(btns[i]);

  T.exit = function () { window.location.href = 'index.html'; };

  /* Scale the 960x540 canvas to fit the screen */
  T.fit = function () {
    var r = Math.min(window.innerWidth / T.W, window.innerHeight / T.H);
    cv.style.width = Math.floor(T.W * r) + 'px'; cv.style.height = Math.floor(T.H * r) + 'px';
  };
  window.addEventListener('resize', T.fit, false); T.fit();


  /* 2D / 3D view: ?v=2d or ?v=3d, remembered, default 3d. Press V (or the 2D/3D pad button) to switch. */
  T.view = function () {
    var m = /[?&]v=(2d|3d)/.exec(window.location.search);
    if (m) return m[1];
    return T.store.get('view', '3d') === '2d' ? '2d' : '3d';
  };
  T.dual = false;
  T.pick = function (d2, d3) {
    T.dual = true; var vw = document.getElementById('vw'); if (vw) vw.style.display = '';
    return function () { if (T.view() === '2d') d2(); else d3(); };
  };
  T.on(function (type, key) {
    if (type !== 'down' || key !== 'view' || !T.dual) return;
    var n = T.view() === '2d' ? '3d' : '2d'; T.store.set('view', n);
    if (window.history && history.replaceState) { try { history.replaceState(null, '', window.location.pathname); } catch (e) { /* ignore */ } }
    T.toast('View: ' + n.toUpperCase(), 1500);
  });

  T.loop = function (update, draw) {
    var last = 0;
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
      update(dt); draw();

    }
    window.requestAnimationFrame(frame);
  };

  T.toast = function (msg, ms) {
    var el = document.getElementById('toast'); el.textContent = msg; el.style.opacity = 1;
    clearTimeout(T._tt); T._tt = setTimeout(function () { el.style.opacity = 0; }, ms || 4000);
  };

  T.store = {
    get: function (k, d) { try { var v = window.localStorage.getItem('tvarcade_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem('tvarcade_' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  };

  T.ac = function () { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; } };
  T.setMuted = function (m) { muted = !!m; };

    if (muted) return;

      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();

      g.gain.setValueAtTime(vol || 0.1, t); g.gain.linearRampToValueAtTime(0, t + dur);

    } catch (e) { /* no audio */ }
  };

  /* Text with a dark outline so it reads on any background */
  T.text = function (s, x, y, size, color, align) {
    var c = T.ctx; c.font = 'bold ' + size + 'px Arial, Helvetica, sans-serif'; c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineWidth = Math.max(3, size / 6); c.strokeStyle = 'rgba(8,12,40,.85)'; c.lineJoin = 'round'; c.strokeText(s, x, y);
    c.fillStyle = color || '#fff'; c.fillText(s, x, y);
  };
  T.panel = function (title, lines, accent) {
    var c = T.ctx; c.fillStyle = 'rgba(8,12,40,.72)'; c.fillRect(0, 0, T.W, T.H);
    T.text(title, T.W / 2, T.H * 0.30, 64, accent || '#ffd21f');
    for (var i = 0; i < lines.length; i++) T.text(lines[i], T.W / 2, T.H * 0.46 + i * 38, 26, '#dfe5ff');
  };
  T.rnd = function (a, b) { return a + Math.random() * (b - a); };
  T.clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  window.setTimeout(function () { T.toast(T.hint, 6000); }, 600);
  return T;
})();
</script>
<script>
(function () {
  var c = TV.ctx, W = TV.W, H = TV.H;
  var OPS = [
    { id: 'add', sym: '+', name: 'Add', col: '#2fae4f', say: 'plus' },
    { id: 'sub', sym: '−', name: 'Subtract', col: '#e8812a', say: 'minus' },
    { id: 'mul', sym: '×', name: 'Multiply', col: '#8a4fd6', say: 'times' },
    { id: 'div', sym: '÷', name: 'Divide', col: '#e0457b', say: 'divided by' }
  ];
  var STYLES = ['tap', 'tap', 'catch', 'catch', 'catch', 'door', 'door', 'balloon', 'balloon', 'balloon'];
  var STYLE_NAME = { tap: 'Tap the answer', catch: 'Catch the fruit', door: 'Open the right door', balloon: 'Pop the balloon' };
  var FRUIT = ['#e53935', '#fb8c00', '#fdd835'];
  var BALLOON = ['#ef5350', '#42a5f5', '#66bb6a', '#ffca28'];

  var mode = 'title', t = 0, opI = 0, op = OPS[0], lvl = 1, qn = 0, first = 0, q = null, style = 'tap', choices = [], gone = [];
  var misses = 0, hintOn = false, sel = 1, fallT = 0, fast = false, celebT = 0, goodIdx = -1, wrongT = 0, palX = 90, bx = 480, by = 400, parts = [];
  var res = { stars: 0, first: 0, change: 0 }, last = '';
  var lvls = TV.store.get('mk_lvl', { add: 1, sub: 1, mul: 1, div: 1 }), best = TV.store.get('mk_best', { add: 0, sub: 0, mul: 0, div: 0 });
  var stickers = TV.store.get('mk_stick', 0), voiceOn = TV.store.get('mk_voice', true);

  function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = ri(0, i), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

  /* ------------------------------------------------------------ questions */

      return { a: a, b: b, ans: a + b };
    }
    if (o === 'sub') {

  function qText(x) { return x.a + ' ' + op.sym + ' ' + x.b + ' = ?'; }
  function makeChoices(ans, n) {
    var set = [ans], offs = shuffle([1, -1, 2, -2, 3, -3, 10, -10, 5]), i;
    if (op.id === 'mul' || op.id === 'div') offs = shuffle([1, -1, 2, -2, q.a > 3 ? q.a : 3, -(q.b > 2 ? q.b : 3), 4]);
    for (i = 0; i < offs.length && set.length < n; i++) { var v = ans + offs[i]; if (v >= 0 && set.indexOf(v) < 0) set.push(v); }
    for (i = 1; set.length < n; i++) if (set.indexOf(ans + 10 + i) < 0) set.push(ans + 10 + i);
    return shuffle(set);
  }

  /* ------------------------------------------------------------ flow */
  function say(s) {
    try {
      if (!voiceOn || !window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
      window.speechSynthesis.cancel(); var u = new window.SpeechSynthesisUtterance(s); u.rate = 0.85; window.speechSynthesis.speak(u);
    } catch (e) { /* no speech */ }
  }
  function sayQ() { if (q) say(q.a + ' ' + op.say + ' ' + q.b); }
  function startRound(i) {
    opI = i; op = OPS[i]; lvl = lvls[op.id] || 1; qn = 0; first = 0; last = ''; mode = 'play'; newQ();
  }
  function newQ() {
    var tries = 0, nq;
    do { nq = gen(op.id, lvl); tries++; } while (q && nq.a === q.a && nq.b === q.b && tries < 6);
    q = nq; style = STYLES[qn]; choices = makeChoices(q.ans, style === 'balloon' ? 4 : 3); gone = []; misses = 0; hintOn = false;
    sel = 1; fallT = 0; fast = false; celebT = 0; goodIdx = -1; wrongT = 0; palX = 90; bx = 480; by = 400; parts = [];

  }
  function finishRound() {
    var s = first >= 9 ? 3 : first >= 7 ? 2 : 1, ch = 0;
    if (first >= 8 && lvl < 3) { lvl++; ch = 1; } else if (first <= 4 && lvl > 1) { lvl--; ch = -1; }
    lvls[op.id] = lvl; if (s > (best[op.id] || 0)) best[op.id] = s; stickers++;
    TV.store.set('mk_lvl', lvls); TV.store.set('mk_best', best); TV.store.set('mk_stick', stickers);
    res = { stars: s, first: first, change: ch }; mode = 'result'; TV.beep(523, 0.12, 'triangle', 0.1); setTimeout(function () { TV.beep(659, 0.12, 'triangle', 0.1); }, 130); setTimeout(function () { TV.beep(784, 0.25, 'triangle', 0.1); }, 260);
  }
  function burst(x, y) {
    var i, cols = ['#ffd21f', '#ff5a8a', '#4aa3ff', '#6ee06e', '#ffffff'];
    for (i = 0; i < 46; i++) { var a = Math.random() * 6.283, sp = 120 + Math.random() * 320; parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, col: cols[i % 5], r: 3 + Math.random() * 4 }); }
  }
  function choose(i) {

    if (choices[i] === q.ans) {
      if (misses === 0) first++;

      TV.beep(523, 0.1, 'triangle', 0.11); setTimeout(function () { TV.beep(784, 0.18, 'triangle', 0.11); }, 100);
    } else {

    }
  }
  function nearest() {
    var bi = -1, bd = 70, i;
    for (i = 0; i < choices.length; i++) { if (gone[i]) continue; var p = balloonPos(i), dx = p[0] - bx, dy = p[1] - by, d = Math.sqrt(dx * dx + dy * dy); if (d < bd) { bd = d; bi = i; } }
    return bi;
  }
  function balloonPos(i) { return [150 + i * 220, 340 + (i % 2) * 56 + Math.sin(t * 1.6 + i * 1.7) * 12]; }

  TV.on(function (type, key, rep) {

      return;
    }
    if (mode === 'result') { if (key === 'ok') startRound(opI); return; }
    if (celebT > 0) return;
    if (key === 'k1') { hintOn = true; return; }
    if (key === 'k2') { sayQ(); return; }
    if (style === 'balloon') { if (key === 'ok') { var n = nearest(); if (n >= 0) choose(n); } return; }
    if (key === 'left') { sel = Math.max(0, sel - 1); TV.beep(440, 0.04, 'triangle', 0.07); }
    else if (key === 'right') { sel = Math.min(2, sel + 1); TV.beep(440, 0.04, 'triangle', 0.07); }
    else if (key === 'ok') { if (style === 'catch') fast = true; else choose(sel); }
  });
  (function () {     /* on-screen buttons for touch screens */
    var pad = document.getElementById('pad'); if (!pad) return;
    var row = document.createElement('div'), defs = [['k1', 'Help'], ['k2', 'Hear'], ['k3', 'Voice']];
    function wire(b, k) {
      function dn(e) { e.preventDefault(); TV.fire('down', k, false); }
      function up(e) { e.preventDefault(); TV.fire('up', k, false); }
      b.addEventListener('touchstart', dn, false); b.addEventListener('touchend', up, false); b.addEventListener('mousedown', dn, false); b.addEventListener('mouseup', up, false);
    }
    for (var d = 0; d < defs.length; d++) { var b = document.createElement('span'); b.className = 'pb'; b.style.fontSize = '12px'; b.appendChild(document.createTextNode(defs[d][1])); wire(b, defs[d][0]); row.appendChild(b); }
    pad.appendChild(row);
  })();

  /* ------------------------------------------------------------ update */
  function update(dt) {

    if (wrongT > 0) wrongT -= dt;
    for (i = parts.length - 1; i >= 0; i--) { var p = parts[i]; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y > H + 20) parts.splice(i, 1); }
    if (mode !== 'play') return;
    if (celebT > 0) {
      celebT -= dt; if (style === 'door') palX += (laneX(goodIdx) - 100 - palX) * Math.min(1, dt * 5);

    }
    if (style === 'catch') {

      if (fallT >= 6.5) { fast = false; fallT = 0; if (!gone[sel]) choose(sel); }

  /* ------------------------------------------------------------ drawing */

  }

    c.fillStyle = 'rgba(0,0,0,0.2)'; c.beginPath(); c.ellipse(0, 28, 24, 7, 0, 0, 6.283); c.fill();
    c.fillStyle = '#4aa3ff'; c.beginPath(); c.ellipse(0, 4, 26, 26, 0, 0, 6.283); c.fill();

    c.strokeStyle = '#16214d'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 9, 7, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    c.restore();

  function dotsFor(x) {
    var items = [], i, j;
    if (op.id === 'add') { for (i = 0; i < x.a; i++) items.push({ col: '#ffd21f' }); items.push({ gap: 1 }); for (i = 0; i < x.b; i++) items.push({ col: '#ff7eb6' }); }
    else if (op.id === 'sub') { for (i = 0; i < x.a; i++) items.push({ col: '#ffd21f', cross: i >= x.a - x.b }); }
    else if (op.id === 'mul') { for (j = 0; j < x.a; j++) { for (i = 0; i < x.b; i++) items.push({ col: j % 2 ? '#ff7eb6' : '#ffd21f' }); if (j < x.a - 1) items.push({ gap: 1 }); } }
    else { for (j = 0; j < x.ans; j++) { for (i = 0; i < x.b; i++) items.push({ col: j % 2 ? '#ff7eb6' : '#ffd21f' }); if (j < x.ans - 1) items.push({ gap: 1 }); } }
    return items;
  }
  function drawHelp() {
    var items = dotsFor(q), n = items.length, s = 30, cols, rows, i, x0 = 60, y0 = 118, w = 840, h = 92;
    for (; s > 8; s -= 2) { cols = Math.floor(w / s); rows = Math.ceil(n / cols); if (rows * s <= h) break; }
    cols = Math.floor(w / s); rows = Math.ceil(n / cols);
    rr(x0 - 10, y0 - 6, w + 20, h + 12, 14); c.fillStyle = 'rgba(255,255,255,0.65)'; c.fill();
    var ox = x0 + (w - Math.min(n, cols) * s) / 2;
    for (i = 0; i < n; i++) {
      var it = items[i], X = ox + (i % cols) * s + s / 2, Y = y0 + 4 + Math.floor(i / cols) * s + s / 2;
      if (it.gap) continue;
      c.fillStyle = it.col; c.beginPath(); c.arc(X, Y, s * 0.38, 0, 6.283); c.fill();
      if (it.cross) { c.strokeStyle = '#d32f2f'; c.lineWidth = 3; c.beginPath(); c.moveTo(X - s * 0.3, Y - s * 0.3); c.lineTo(X + s * 0.3, Y + s * 0.3); c.moveTo(X + s * 0.3, Y - s * 0.3); c.lineTo(X - s * 0.3, Y + s * 0.3); c.stroke(); }
    }
  }
  function glow(i) { return misses >= 3 && choices[i] === q.ans && Math.sin(t * 8) > 0; }

  function drawTap() {
    for (var i = 0; i < 3; i++) {
      var x = laneX(i) - 110, y = 280, w = 220, h = 170, f = sel === i, off = gone[i];
      if (f) { x -= 8; y -= 8; w += 16; h += 16; }
      c.globalAlpha = off ? 0.25 : 1; rr(x, y, w, h, 24); c.fillStyle = op.col; c.fill();
      c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 6, y + 6, w - 12, h * 0.4, 18); c.fill();
      if (f || glow(i)) { rr(x - 5, y - 5, w + 10, h + 10, 28); c.strokeStyle = glow(i) ? '#ffd21f' : '#fff'; c.lineWidth = 6; c.stroke(); }
      TV.text(String(choices[i]), x + w / 2, y + h / 2 + 4, 84, '#fff', 'center'); c.globalAlpha = 1;
    }
  }
  function drawDoor() {
    c.fillStyle = '#6dbb5a'; c.fillRect(0, 470, W, 70);
    for (var i = 0; i < 3; i++) {
      var x = laneX(i) - 85, y = 270, w = 170, h = 205, f = sel === i, off = gone[i];
      c.globalAlpha = off ? 0.25 : 1;
      c.fillStyle = '#7b4a2b'; rr(x - 8, y - 8, w + 16, h + 8, 20); c.fill();
      var open = celebT > 0 && goodIdx === i;
      c.fillStyle = open ? '#fff3b0' : OPS[opI].col; rr(x, y, w, h, 16); c.fill();
      if (!open) { c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 8, y + 8, w - 16, 60, 12); c.fill(); c.fillStyle = '#ffd21f'; c.beginPath(); c.arc(x + w - 24, y + h * 0.55, 9, 0, 6.283); c.fill(); }
      if (f || glow(i)) { rr(x - 12, y - 12, w + 24, h + 16, 24); c.strokeStyle = glow(i) ? '#ffd21f' : '#fff'; c.lineWidth = 6; c.stroke(); }
      TV.text(String(choices[i]), x + w / 2 - 6, y + h / 2 - 8, 70, '#fff', 'center'); c.globalAlpha = 1;
    }
    pal(palX, 440, 1.1);
  }
  function drawCatch() {
    var fr = fallT / 6.5, y = 235 + fr * 215, i;
    c.fillStyle = '#6dbb5a'; c.fillRect(0, 500, W, 40);
    for (i = 0; i < 3; i++) {
      var x = laneX(i);
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(x - 110, 225, 220, 280);
      if (!gone[i] && !(celebT > 0 && goodIdx !== i)) {
        var yy = (celebT > 0 && goodIdx === i) ? 450 : y;
        c.fillStyle = FRUIT[i]; c.beginPath(); c.arc(x, yy, 48, 0, 6.283); c.fill();
        c.fillStyle = '#3a8a2b'; c.beginPath(); c.ellipse(x + 8, yy - 50, 14, 7, -0.5, 0, 6.283); c.fill();
        if (glow(i)) { c.strokeStyle = '#ffd21f'; c.lineWidth = 6; c.beginPath(); c.arc(x, yy, 56, 0, 6.283); c.stroke(); }
        TV.text(String(choices[i]), x, yy + 3, 46, '#fff', 'center');
      }
    }
    var bxx = laneX(sel);
    c.fillStyle = '#b7793a'; c.beginPath(); c.moveTo(bxx - 70, 470); c.lineTo(bxx + 70, 470); c.lineTo(bxx + 52, 520); c.lineTo(bxx - 52, 520); c.closePath(); c.fill();
    c.fillStyle = '#d99a52'; c.fillRect(bxx - 74, 464, 148, 10);
  }
  function drawBalloons() {
    for (var i = 0; i < 4; i++) {
      if (gone[i] && !(celebT > 0 && goodIdx === i)) continue;
      if (celebT > 0 && goodIdx === i) continue;
      var p = balloonPos(i);
      c.strokeStyle = 'rgba(40,50,90,0.6)'; c.lineWidth = 2; c.beginPath(); c.moveTo(p[0], p[1] + 62); c.quadraticCurveTo(p[0] + 10 * Math.sin(t * 2 + i), p[1] + 100, p[0], p[1] + 135); c.stroke();
      c.fillStyle = BALLOON[i]; c.beginPath(); c.ellipse(p[0], p[1], 58, 68, 0, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.3)'; c.beginPath(); c.ellipse(p[0] - 20, p[1] - 28, 12, 20, -0.5, 0, 6.283); c.fill();
      c.fillStyle = BALLOON[i]; c.beginPath(); c.moveTo(p[0], p[1] + 66); c.lineTo(p[0] - 8, p[1] + 78); c.lineTo(p[0] + 8, p[1] + 78); c.closePath(); c.fill();
      if (glow(i)) { c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.ellipse(p[0], p[1], 66, 76, 0, 0, 6.283); c.stroke(); }
      TV.text(String(choices[i]), p[0], p[1] + 2, 52, '#fff', 'center');
    }
    if (celebT <= 0) {
      var n = nearest(); c.strokeStyle = n >= 0 ? '#ffd21f' : '#ffffff'; c.lineWidth = 5; c.beginPath(); c.arc(bx, by, 26 + (n >= 0 ? 4 : 0), 0, 6.283); c.stroke();
      c.beginPath(); c.moveTo(bx - 38, by); c.lineTo(bx - 14, by); c.moveTo(bx + 14, by); c.lineTo(bx + 38, by); c.moveTo(bx, by - 38); c.lineTo(bx, by - 14); c.moveTo(bx, by + 14); c.lineTo(bx, by + 38); c.stroke();
    }
  }

  function drawMenu() {
    TV.text('PICK A GAME', W / 2, 60, 46, '#fff', 'center');
    for (var i = 0; i < 4; i++) {
      var o = OPS[i], x = 78 + i * 210, y = 120, w = 190, h = 290, f = opI === i;
      if (f) { x -= 8; y -= 10; w += 16; h += 20; }
      rr(x, y, w, h, 24); c.fillStyle = o.col; c.fill(); c.fillStyle = 'rgba(255,255,255,0.2)'; rr(x + 6, y + 6, w - 12, 90, 18); c.fill();
      if (f) { rr(x - 5, y - 5, w + 10, h + 10, 28); c.strokeStyle = '#fff'; c.lineWidth = 6; c.stroke(); }
      TV.text(o.sym, x + w / 2, y + 85, 110, '#fff', 'center'); TV.text(o.name, x + w / 2, y + 175, 30, '#fff', 'center');
      TV.text('Level ' + (lvls[o.id] || 1), x + w / 2, y + 215, 22, '#fff', 'center');
      for (var k = 0; k < 3; k++) star(x + w / 2 - 34 + k * 34, y + 255, 12, k < (best[o.id] || 0) ? '#ffd21f' : 'rgba(255,255,255,0.35)');
    }
    TV.text('Stickers: ' + stickers, 70, 480, 24, '#fff', 'left');
    for (var s = 0; s < Math.min(stickers, 14); s++) star(260 + s * 36, 480, 14, ['#ffd21f', '#ff7eb6', '#6ee06e', '#4aa3ff', '#ff9a5c'][s % 5]);
  }

  function draw() {
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5aa9ff'); g.addColorStop(1, '#cfeaff'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    var i;
    if (mode === 'title') {
      pal(W / 2, 150 + Math.sin(t * 3) * 6, 2.2);
      TV.panel('MATH PALS', ['Add, subtract, multiply and divide', 'Pick the right answer with the arrow keys', 'Press OK to start'], '#ffd21f'); return;
    }
    if (mode === 'menu') { drawMenu(); return; }
    /* top bar */
    c.fillStyle = op.col; c.beginPath(); c.arc(46, 40, 30, 0, 6.283); c.fill(); TV.text(op.sym, 46, 42, 40, '#fff', 'center');
    for (i = 0; i < 10; i++) { c.fillStyle = i < qn ? '#ffd21f' : i === qn ? '#ffffff' : 'rgba(255,255,255,0.4)'; c.beginPath(); c.arc(W - 40 - (9 - i) * 28, 36, 9, 0, 6.283); c.fill(); }
    TV.text('Level ' + lvl + '  •  ' + (mode === 'play' ? STYLE_NAME[style] : ''), 100, 40, 20, '#fff', 'left');
    if (mode === 'play') {
      TV.text(qText(q), W / 2, 84, 60, '#fff', 'center');
      if (hintOn || misses >= 2 || lvl === 1) drawHelp();
      if (style === 'tap') drawTap(); else if (style === 'door') drawDoor(); else if (style === 'catch') drawCatch(); else drawBalloons();
      if (style === 'catch') TV.text('Left / Right: move the basket.  OK: drop it faster', W / 2, 528, 18, '#fff', 'center');
      else if (style === 'balloon') TV.text('Arrows: move.  OK: pop', W / 2, 528, 18, '#fff', 'center');
      if (wrongT > 0) TV.text('Try again!', W / 2, 232, 34, '#ffe08a', 'center');
      if (celebT > 0) TV.text('Great!', W / 2, 232, 44, '#ffd21f', 'center');
    }
    if (mode === 'result') {
      TV.panel(res.stars === 3 ? 'AMAZING!' : res.stars === 2 ? 'WELL DONE!' : 'GOOD TRY!', [res.first + ' of 10 right on the first try', res.change > 0 ? 'Level up! Harder sums next' : res.change < 0 ? 'Next time: a little easier' : 'Same level next time', 'You earned a sticker. OK: play again   Back: menu'], op.col);
      for (i = 0; i < 3; i++) star(W / 2 - 60 + i * 60, 118, 24, i < res.stars ? '#ffd21f' : 'rgba(255,255,255,0.3)');
    }
    for (i = 0; i < parts.length; i++) { c.fillStyle = parts[i].col; c.fillRect(parts[i].x, parts[i].y, parts[i].r, parts[i].r * 1.5); }
  }

  TV.loop(update, draw);
})();
</script>
